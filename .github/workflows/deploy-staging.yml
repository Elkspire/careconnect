name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false      # never interrupt a migration halfway

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Show pending migrations
        run: supabase db push --db-url "$DB_URL" --dry-run
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Apply migrations
        run: supabase db push --db-url "$DB_URL"
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate               # only deploys if migrations succeeded
    runs-on: ubuntu-latest
    environment: staging
    # Staging is Vercel's Production environment: that is where its settings
    # live, it's public (Preview sits behind Vercel login), and Vercel Cron
    # only runs on production deployments.
    strategy:
      matrix:
        project: [VERCEL_API_PROJECT_ID, VERCEL_WEB_PROJECT_ID]
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - run: npm i -g vercel@latest
      - name: Pull production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Deploy
        run: |
          url=$(vercel deploy --prod --token="$VERCEL_TOKEN")
          echo "Deployed $url to production" >> "$GITHUB_STEP_SUMMARY"