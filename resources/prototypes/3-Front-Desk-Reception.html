<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareConnect · Front desk prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0B7A75;--teal-d:#075E5A;--teal-50:#E6F4F3;--navy:#0E2233;--ink:#0F1B2D;--muted:#5B6B7F;--line:#E3E8EF;--bg:#F3F6F9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{font-family:'Plus Jakarta Sans',Inter,sans-serif;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2}
.app{min-height:100vh;display:flex}
.rail{width:96px;flex:none;background:var(--navy);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px}
.rail button{width:80px;min-height:64px;border:0;background:none;border-radius:14px;color:#C3D2DF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;position:relative}
.rail button:hover{background:#17344A;color:#fff}
.rail button.on{background:var(--teal);color:#fff}
.rail .bdg{position:absolute;top:6px;right:14px;background:#F79009;color:#0F1B2D;border-radius:999px;font-size:10px;font-weight:700;padding:0 6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
@media (max-width:760px){.app{flex-direction:column}.rail{width:100%;flex-direction:row;overflow-x:auto;padding:8px}.rail button{flex:none;width:76px}.rail .logo{display:none}.content{padding:14px}.topbar{padding:12px 14px}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid #D0D8E2;background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dan{border-color:#FDA29B;color:#B42318}.btn.dan:hover{background:#FEF3F2}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#EEF2F6}
.btn.sm{min-height:34px;padding:0 12px;font-size:12px;border-radius:9px}
.btn.lg{min-height:56px;font-size:16px;padding:0 24px;border-radius:14px}
.btn.ico{width:44px;padding:0}.btn.sm.ico{width:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:0}
.hi{background:#FEE4E2;color:#B42318}.md{background:#FEF0C7;color:#93370D}.lo{background:#DCFAE6;color:#067647}.info{background:#E0F2FE;color:#075985}.neu{background:#EEF2F6;color:#364152}.tl{background:var(--teal-50);color:#0B5F5B}.pu{background:#EEF0FF;color:#3E3CB0}
.pill{border:1px solid #D0D8E2;background:#fff;color:#344054;border-radius:999px;padding:0 14px;min-height:38px;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--teal)}.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.inp{height:46px;border:1px solid #D0D8E2;border-radius:12px;padding:0 14px;background:#fff;width:100%;font-size:15px}
.inp:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
textarea.inp{height:auto;padding:10px 14px}
.lbl{font-size:12px;font-weight:600;color:#475467;display:block;margin-bottom:6px}
.muted{color:var(--muted)}.sm{font-size:12px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;gap:16px}
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.icob{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sec{font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans'}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid #EEF2F6;vertical-align:middle}
.scroll{overflow-x:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.token{font-family:'Plus Jakarta Sans';font-weight:800;letter-spacing:.02em}
.col{background:#EEF2F6;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:420px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.qcard.urgent{border-color:#FDA29B;box-shadow:inset 4px 0 0 #D92D20}
.bg{position:fixed;inset:0;background:rgba(15,27,45,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:20px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 24px 64px rgba(15,27,45,.25)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;z-index:60;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.steps{display:flex;gap:6px;margin:14px 0 18px}
.steps div{flex:1;height:6px;border-radius:9px;background:#E3E8EF}.steps div.on{background:var(--teal)}
.tv{background:#0B1622;color:#fff;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:20px}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(127,227,218,.8)}100%{box-shadow:0 0 0 24px rgba(127,227,218,0)}}
.flash{animation:flash 1s ease-out 3}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numpad button{height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.slip{width:280px;background:#fff;border:1px dashed #98A2B3;border-radius:6px;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;text-align:center;margin:0 auto}
</style>

<style id="cc-gradient">
html{min-height:100%;background:radial-gradient(1100px 620px at 100% -8%,rgba(11,122,117,.20),transparent 62%),radial-gradient(900px 640px at -5% 105%,rgba(62,60,176,.13),transparent 60%),linear-gradient(160deg,#E7F5F3 0%,#F2F6F9 46%,#ECEFFB 100%)}
body{background:transparent!important}
.main{background:transparent}
.topbar{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card{box-shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px rgba(15,27,45,.04)}
</style>

 <div class="row" style="background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:6px 12px">${I('clock',18)}<b id="clk">${hm(nowMin())}</b></div>
 <button class="btn" data-a="openCheckin">${I('checkin',18)}Check in</button><button class="btn pri" data-a="openWalkin">${I('plus',18)}Walk-in</button>
 <div class="row"><span class="av info">KA</span><div><div class="b">Kamran Ali</div><div class="muted sm">Receptionist · shift 8 AM–4 PM</div></div></div></header>
 <div class="content">${V[S.page]()}</div></div>`;
}
function render(){const y=window.scrollY;document.getElementById('app').innerHTML=shell();renderOv();try{window.scrollTo(0,y)}catch(_){}}
function renderOv(){document.getElementById('ov').innerHTML=(S.modal?`<div class="bg" data-a="closeModal"><div class="modal" role="dialog" aria-modal="true" data-stop="1">${M[S.modal]()}</div></div>`:'')+(S.toast?`<div class="toast" role="status">${I('check',18,'#7FE3DA',2.4)}<span>${esc(S.toast)}</span></div>`:'')}
const mhead=(t,sub)=>`<div class="between"><div><h2 style="font-size:20px">${t}</h2>${sub?`<div class="muted sm">${sub}</div>`:''}</div><button class="btn ico ghost" aria-label="Close" data-a="closeModal">${I('x')}</button></div>`;
const go=p=>{S.page=p;S.modal=null;render()};
A.closeModal=()=>{S.modal=null;render()};
A.lock=()=>{S.modal='lock';S.pin='';renderOv()};
M.lock=()=>`<div class="stack" style="align-items:center;gap:14px;text-align:center">${LOGO}<h2>Screen locked</h2><p class="muted">Enter your 4-digit PIN to continue (demo: any 4 digits).</p><div class="row" style="gap:10px">${[0,1,2,3].map(i=>`<span style="width:16px;height:16px;border-radius:50%;background:${(S.pin||'').length>i?'#0B7A75':'#E3E8EF'}"></span>`).join('')}</div><div class="numpad" style="width:260px">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-a="pin" data-v="${k}">${k}</button>`).join('')}</div></div>`;
A.pin=v=>{S.pin=v==='⌫'?(S.pin||'').slice(0,-1):(S.pin||'')+v;if(S.pin.length>=4){S.modal=null;render();toast('Welcome back, Kamran')}else renderOv()};

/* ===== queue helpers ===== */
const NEXT={waiting:['vitals','Send to vitals'],vitals:['ready','Vitals done'],ready:['consult','Call in'],consult:['billing','Consult finished'],billing:['done','Collect payment']};
function newToken(d){const pre=DOCS[d].pre+'-';const mx=Q.filter(q=>q.token&&q.token.startsWith(pre)).reduce((m,q)=>Math.max(m,parseInt(q.token.slice(2))),tokN[d]);return pre+String(mx+1).padStart(3,'0')}
function advance(q,to){
 if(to==='consult'){const cur=Q.find(x=>x.doc===q.doc&&x.status==='consult');if(cur)toBilling(cur);q.calledAt=nowMin();S.serving[q.doc]=q.token;S.lastCall={token:q.token,doc:q.doc,at:Date.now()};DOCS[q.doc].status='In consult'}
 if(to==='billing'){toBilling(q);return}
 if(to==='done'&&q.status==='billing'){S.bill=q.id;go('billing');return}
 q.status=to;
}
function toBilling(q){const d=DOCS[q.doc];q.status='billing';q.items=q.items||[[`Consultation — ${d.name}${q.type==='Video'?' (video)':''}`,q.type==='Video'?d.vfee:d.fee]];if(q.type==='Video'){q.status='done';q.paid=true;q.amt=d.vfee;q.method='Paid in app'}}
function callNext(d){const r=Q.filter(q=>q.doc===d&&q.status==='ready').sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||a.arr-b.arr)[0];if(!r){toast('No one ready for '+DOCS[d].name+' — send someone from vitals first');return}advance(r,'consult');render();toast(`Calling ${r.token} · ${pt(r.mrn).name} to ${DOCS[d].room}`)}

/* ===== QUEUE BOARD ===== */
V.board=()=>{
 const f=q=>S.filterDoc==='all'||q.doc===S.filterDoc;
 const cols=[['Waiting & vitals',['waiting','vitals']],['Ready for doctor',['ready']],['With doctor',['consult']],['Billing',['billing']],['Done',['done']]];
 const arriving=Q.filter(q=>q.status==='booked'&&f(q)).sort((a,b)=>a.appt-b.appt);
 const inClinic=Q.filter(q=>['waiting','vitals','ready','consult','billing'].includes(q.status)).length;
 const avgW=(()=>{const w=Q.filter(q=>['waiting','vitals','ready'].includes(q.status)).map(wait);return w.length?Math.round(w.reduce((a,b)=>a+b,0)/w.length):0})();
 const card=q=>{const p=pt(q.mrn),d=DOCS[q.doc],w=wait(q),nx=NEXT[q.status];return `<div class="qcard ${q.urgent?'urgent':''}" draggable="true" data-drag="${q.id}">
  <div class="between"><span class="token" style="font-size:18px;color:${d.col}">${q.token}</span>${q.status==='done'?`<span class="chip lo">${q.method||'Paid'}</span>`:q.status==='consult'?`<span class="chip pu">${d.room}</span>`:`<span class="chip ${w>=30?'hi':w>=15?'md':'neu'}">${I('clock',12)}${w} min</span>`}</div>
  <div><b>${esc(p.name)}</b> <span class="muted sm">${p.age} y · ${p.sex}</span></div>
  <div class="sm muted">${esc(q.reason)}</div>
  <div class="row wrap" style="gap:6px"><span class="chip" style="background:${d.bg};color:${d.col}">${d.name.replace('Dr. ','Dr ')}</span><span class="chip ${q.type==='Walk-in'?'md':q.type==='Video'?'pu':'neu'}">${q.type}</span>${q.urgent?'<span class="chip hi">'+I('alert',12)+'Urgent</span>':''}</div>
  ${q.vitals&&['ready','consult'].includes(q.status)?`<div class="sm" style="background:#F8FAFC;border-radius:8px;padding:6px 8px">${q.vitals}</div>`:''}
  ${nx&&q.type!=='Video'?`<button class="btn sm ${q.status==='ready'?'pri':''}" data-a="adv" data-v="${q.id}">${nx[1]} ${I('chev',14)}</button>`:''}
  ${q.status==='consult'&&q.type==='Video'?'<div class="sm muted">Video consult · fee paid in app</div>':''}
 </div>`};
 return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">${[['users','tl',inClinic,'Patients in clinic'],['clock','md',avgW+' min','Average wait now'],['cal','info',arriving.length,'Still to arrive today'],['money','pu',rs(Q.filter(q=>q.status==='done'&&q.paid).reduce((a,q)=>a+(q.amt||0),0)),'Collected today']].map(k=>`<div class="card row" style="padding:16px"><span class="icob ${k[1]}">${I(k[0])}</span><div><div style="font-size:22px;font-weight:700;font-family:'Plus Jakarta Sans'">${k[2]}</div><div class="muted sm">${k[3]}</div></div></div>`).join('')}</div>
 <div class="row wrap" style="gap:8px"><span class="muted sm b">Doctor</span><button class="pill ${S.filterDoc==='all'?'on':''}" data-a="fdoc" data-v="all">All doctors</button>${Object.values(DOCS).map(d=>`<button class="pill ${S.filterDoc===d.id?'on':''}" data-a="fdoc" data-v="${d.id}"><span class="dot" style="background:${S.filterDoc===d.id?'#fff':d.col}"></span>${d.name}</button>`).join('')}</div>
 ${arriving.length?`<section class="card" style="padding:14px 16px"><div class="between" style="margin-bottom:10px"><h3 class="sec">Arriving soon</h3><span class="muted sm">Booked appointments not checked in</span></div><div class="row" style="gap:10px;overflow-x:auto;padding-bottom:4px">${arriving.map(q=>{const p=pt(q.mrn),late=q.appt<nowMin();return `<div class="stack" style="flex:none;width:250px;border:1px solid ${late?'#FDA29B':'var(--line)'};border-radius:12px;padding:10px 12px;gap:6px"><div class="between"><b>${hm(q.appt)}</b>${late?'<span class="chip hi">Late</span>':`<span class="chip ${q.type==='Video'?'pu':'neu'}">${q.type}</span>`}</div><div class="b">${esc(p.name)}</div><div class="muted sm">${DOCS[q.doc].name} · ${esc(q.reason)}</div><div class="row" style="gap:6px">${q.type==='Video'?`<button class="btn sm" style="flex:1" data-a="remind" data-v="${q.id}">Send video link</button>`:`<button class="btn sm pri" style="flex:1" data-a="ciAppt" data-v="${q.id}">Check in</button><button class="btn sm ico" aria-label="Call patient" data-a="callPt" data-v="${q.id}">${I('phone',15)}</button>`}</div></div>`}).join('')}</div></section>`:''}
 <div class="row wrap" style="gap:16px;align-items:flex-start">
 <div class="grid" style="flex:999 1 700px;min-width:0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${cols.map(c=>{const items=Q.filter(q=>c[1].includes(q.status)&&f(q)).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||(a.arr||0)-(b.arr||0));return `<div class="col" data-drop="${c[1][0]}"><div class="between" style="padding:2px 4px"><b>${c[0]}</b><span class="chip neu" style="background:#fff">${items.length}</span></div>${items.map(card).join('')||'<div class="muted sm" style="text-align:center;padding:20px 6px">Drop a patient here</div>'}</div>`}).join('')}</div>
 <aside class="stack" style="flex:1 1 280px;gap:16px;min-width:0">
  <section class="card stack" style="padding:16px;gap:10px"><div class="between"><h3 class="sec">Rooms</h3><button class="lnk" style="border:0;background:none;color:var(--teal);font-weight:600" data-go="doctors">Manage</button></div>
  ${Object.values(DOCS).map(d=>{const ready=Q.filter(q=>q.doc===d.id&&q.status==='ready').length;return `<div class="row" style="padding:8px 0;border-bottom:1px solid #F2F4F7"><span class="av" style="background:${d.bg};color:${d.col};width:36px;height:36px">${ini(d.name)}</span><div style="flex:1;min-width:0"><div class="b sm">${d.room} · ${d.name.replace('Dr. ','Dr ')}</div><div class="sm"><span class="chip ${d.status==='Available'?'lo':d.status==='In consult'?'pu':d.status==='Running late'||d.late?'md':'neu'}" style="padding:0 8px">${d.late?'Late '+d.late+' min':d.status}</span> <span class="muted">· ${ready} ready</span></div></div><button class="btn sm ${ready?'pri':''}" data-a="callNext" data-v="${d.id}" ${ready?'':'disabled'} aria-label="Call next patient for ${d.name}">${I('volume',15)}Call</button></div>`}).join('')}</section>
  <section class="card stack" style="padding:16px;gap:10px"><div class="between"><h3 class="sec">Call-backs</h3><span class="chip md">${S.callbacks.filter(c=>!c.done).length}</span></div>
  ${S.callbacks.map((c,i)=>`<div class="stack" style="gap:6px;padding:10px;border:1px solid #EEF2F6;border-radius:12px;opacity:${c.done?.55:1}"><div class="between"><b>${c.n}</b><span class="muted sm">${c.t}</span></div><div class="sm">${c.r}</div><div class="row" style="gap:6px"><button class="btn sm" style="flex:1" data-a="dial" data-v="${i}">${I('phone',14)}${c.p}</button><button class="btn sm ${c.done?'':'pri'}" data-a="cbDone" data-v="${i}">${c.done?'Done':'Mark done'}</button></div></div>`).join('')}</section>
 </aside></div>`;
};
A.fdoc=v=>{S.filterDoc=v;render()};
A.adv=v=>{const q=Q.find(x=>x.id===+v),nx=NEXT[q.status];if(!nx)return;
 if(q.status==='vitals'){q.vitals=q.vitals||['BP 136/88 · SpO2 95% · Temp 99.1 °F','BP 118/76 · Wt 61 kg','BP 124/80 · Temp 100.2 °F'][q.id%3]}
 const tk=q.token;advance(q,nx[0]);if(S.page!=='billing')render();toast(nx[0]==='consult'?`Calling ${tk} to ${DOCS[q.doc].room} — shown on waiting TV`:nx[0]==='billing'?`${tk} sent to billing`:nx[0]==='vitals'?`${tk} sent to nurse Hina for vitals`:nx[0]==='ready'?`${tk} vitals recorded · ready for doctor`:'Updated')};
A.callNext=v=>callNext(v);
A.callPt=v=>{const q=Q.find(x=>x.id===+v);toast('Calling '+pt(q.mrn).name+' · '+pt(q.mrn).phone)};
A.remind=v=>{const q=Q.find(x=>x.id===+v);toast('Video link sent to '+pt(q.mrn).name+' by SMS & WhatsApp')};
A.dial=v=>toast('Dialling '+S.callbacks[+v].p+' from clinic line…');
A.cbDone=v=>{S.callbacks[+v].done=!S.callbacks[+v].done;render()};

/* ===== CHECK-IN WIZARD ===== */
function startCI(o){S.ci=Object.assign({step:1,q:'',mrn:null,isNew:false,np:{name:'',phone:'',age:'',sex:'Female'},doc:'a',reason:'',urgent:false,payer:'Self-pay',verify:0,payNow:false,apptId:null,consent:true,token:null},o);S.modal='checkin';renderOv()}
A.openCheckin=()=>startCI({});
A.openWalkin=()=>startCI({walkin:true});
A.ciAppt=v=>{const q=Q.find(x=>x.id===+v),p=pt(q.mrn);startCI({step:2,mrn:q.mrn,doc:q.doc,reason:q.reason,payer:p.payer,apptId:q.id})};
M.checkin=()=>{const c=S.ci;const title=c.apptId?'Check in appointment':c.walkin?'Walk-in patient':'Check in patient';
 const bar=`<div class="steps">${[1,2,3,4].map(i=>`<div class="${c.step>=i?'on':''}"></div>`).join('')}</div>`;
 const labels=['Find patient','Confirm details','Payment & insurance','Token'];
 let body='';
 if(c.step===1){const ql=c.q.toLowerCase().replace(/[\s-]/g,'');const res=ql?DIR.filter(p=>(p.name+p.mrn+p.phone+p.cnic).toLowerCase().replace(/[\s-]/g,'').includes(ql)):[];
  const appts=Q.filter(q=>q.status==='booked'&&q.type!=='Video');
  body=`<div class="tabs row" style="gap:6px;margin-bottom:14px"><button class="pill ${!c.isNew?'on':''}" data-a="ciNew" data-v="0">Existing patient</button><button class="pill ${c.isNew?'on':''}" data-a="ciNew" data-v="1">New patient</button></div>
  ${!c.isNew?`<label class="lbl" for="ciq">Search by phone, CNIC, name or MRN</label><div style="position:relative"><span style="position:absolute;left:14px;top:13px;color:var(--muted)">${I('search')}</span><input id="ciq" class="inp" style="padding-left:44px" placeholder="e.g. 0312 9087114" value="${esc(c.q)}" data-i="ci.q" autocomplete="off"></div>
   <div class="stack" style="gap:8px;margin-top:12px">${(res.length?res:(!ql?[]:[])).slice(0,5).map(p=>`<button class="row" data-a="ciPick" data-v="${p.mrn}" style="border:1px solid ${c.mrn===p.mrn?'#0B7A75':'var(--line)'};background:${c.mrn===p.mrn?'#F0FAF9':'#fff'};border-radius:12px;padding:10px 12px;text-align:left"><span class="av tl">${ini(p.name)}</span><span style="flex:1"><b>${p.name}</b><span class="muted sm" style="display:block">${p.mrn} · ${p.age} y · ${p.phone} · ${p.payer}</span></span>${Q.find(q=>q.mrn===p.mrn&&q.status==='booked')?'<span class="chip info">Has appointment</span>':''}</button>`).join('')}
   ${ql&&!res.length?`<div class="muted sm" style="padding:12px;background:#F8FAFC;border-radius:10px">No match. <button style="border:0;background:none;color:var(--teal);font-weight:600" data-a="ciNew" data-v="1">Register as new patient</button></div>`:''}
   ${!ql&&!c.walkin?`<div class="lbl" style="margin-top:6px">Today's appointments not yet arrived</div>${appts.map(q=>`<button class="row" data-a="ciPick" data-v="${q.mrn}" data-x="${q.id}" style="border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left"><b style="width:76px">${hm(q.appt)}</b><span style="flex:1"><b>${pt(q.mrn).name}</b><span class="muted sm" style="display:block">${DOCS[q.doc].name} · ${q.reason}</span></span>${I('chev',16)}</button>`).join('')}`:''}</div>`:
  `<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div style="grid-column:span 2"><label class="lbl" for="nn">Full name</label><input id="nn" class="inp" placeholder="As on CNIC" value="${esc(c.np.name)}" data-i="ci.np.name"></div><div><label class="lbl" for="nph">Mobile</label><input id="nph" class="inp" inputmode="tel" placeholder="03XX XXXXXXX" value="${esc(c.np.phone)}" data-i="ci.np.phone"></div><div><label class="lbl" for="nag">Age</label><input id="nag" class="inp" inputmode="numeric" value="${esc(c.np.age)}" data-i="ci.np.age"></div><div><label class="lbl" for="ncn">CNIC / B-Form</label><input id="ncn" class="inp" placeholder="00000-0000000-0"></div><div><span class="lbl">Sex</span><div class="row" style="gap:6px">${['Female','Male','Other'].map(s=>`<button class="pill ${c.np.sex===s?'on':''}" data-a="ciSex" data-v="${s}">${s}</button>`).join('')}</div></div></div><p class="muted sm" style="margin-top:10px">The patient gets an SMS to download CareConnect and see their records.</p>`}`;}
 if(c.step===2){const p=c.mrn?pt(c.mrn):{name:c.np.name||'New patient',phone:c.np.phone||'—',cnic:'—',addr:'—',age:c.np.age||'—',sex:c.np.sex[0],mrn:'New'};
  body=`<div class="row" style="background:#F8FAFC;border-radius:14px;padding:12px"><span class="av tl" style="width:48px;height:48px">${ini(p.name)}</span><div style="flex:1"><b style="font-size:16px">${esc(p.name)}</b><div class="muted sm">${p.mrn} · ${p.age} y · ${p.sex}</div></div><span class="chip lo">${I('check',12)}Identity confirmed</span></div>
  <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px"><div><label class="lbl" for="cph">Mobile (for token SMS)</label><input id="cph" class="inp" value="${esc(p.phone)}"></div><div><label class="lbl" for="ccn">CNIC / B-Form</label><input id="ccn" class="inp" value="${esc(p.cnic)}"></div><div style="grid-column:span 2"><label class="lbl" for="cad">Address</label><input id="cad" class="inp" value="${esc(p.addr)}"></div>
  <div style="grid-column:span 2"><span class="lbl">Doctor</span><div class="row wrap" style="gap:6px">${Object.values(DOCS).map(d=>{const n=Q.filter(q=>q.doc===d.id&&['waiting','vitals','ready'].includes(q.status)).length;return `<button class="pill ${c.doc===d.id?'on':''}" data-a="ciDoc" data-v="${d.id}">${d.name} · ${n} waiting${d.late?' · late '+d.late+'m':''}</button>`}).join('')}</div></div>
  <div style="grid-column:span 2"><label class="lbl" for="crs">Reason for visit</label><input id="crs" class="inp" placeholder="e.g. Fever and cough" value="${esc(c.reason)}" data-i="ci.reason" data-norender="1"></div></div>
  <div class="stack" style="gap:8px;margin-top:14px;background:#FEF3F2;border:1px solid #FECDCA;border-radius:12px;padding:12px"><b class="sm" style="color:#B42318">Quick triage — tick if any apply</b><div class="row wrap" style="gap:6px">${['Chest pain','Difficulty breathing','Heavy bleeding','Fainting','High fever in child','Pregnant with pain'].map(x=>`<button class="pill ${c.tri&&c.tri[x]?'on':''}" style="${c.tri&&c.tri[x]?'background:#D92D20;border-color:#D92D20':''}" data-a="ciTri" data-v="${x}">${x}</button>`).join('')}</div>${c.urgent?'<div class="sm"><b>Marked urgent:</b> patient goes to the top of the queue and the nurse is alerted now.</div>':''}</div>
  <label class="row sm" style="margin-top:12px"><input type="checkbox" ${c.consent?'checked':''} data-a="ciConsent" style="width:18px;height:18px;accent-color:#0B7A75">Patient agrees to treatment and to their data being stored securely in CareConnect</label>`;}
 if(c.step===3){const d=DOCS[c.doc];const ins=c.payer!=='Self-pay';
  body=`<span class="lbl">Who is paying?</span><div class="row wrap" style="gap:6px">${['Self-pay','Sehat Card','State Life','Jubilee Health','EFU Health','Corporate panel'].map(x=>`<button class="pill ${c.payer===x?'on':''}" data-a="ciPayer" data-v="${x}">${x}</button>`).join('')}</div>
  ${ins?`<div class="card stack" style="padding:14px;gap:10px;margin-top:14px"><div class="between"><div class="row">${I('shield',20,'#0B7A75')}<b>${c.payer} eligibility</b></div>${c.verify===2?'<span class="chip lo">Eligible</span>':c.verify===1?'<span class="chip info">Checking…</span>':'<span class="chip neu">Not checked</span>'}</div>
   ${c.verify===2?`<div class="grid sm" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div><span class="muted">Member</span><br><b>${esc(c.mrn?pt(c.mrn).name:c.np.name)}</b></div><div><span class="muted">Policy / card</span><br><b>${c.payer==='Sehat Card'?'CNIC-linked family card':'POL-'+(48120+(c.mrn?c.mrn.length:3))}</b></div><div><span class="muted">Remaining balance (sample)</span><br><b>Rs 7,20,000</b></div><div><span class="muted">Covers today</span><br><b>${c.payer==='Sehat Card'?'Consultation & lab':'Consultation (80%)'}</b></div></div>`:`<button class="btn sm" data-a="ciVerify">${I('refresh',15)}Verify with CNIC</button>`}</div>`:''}
  <div class="card stack" style="padding:14px;gap:8px;margin-top:14px"><div class="between"><span>Consultation — ${d.name}</span><b>${rs(d.fee)}</b></div>${ins&&c.verify===2?`<div class="between sm" style="color:#067647"><span>Covered by ${c.payer}</span><b>− ${rs(c.payer==='Sehat Card'?d.fee:d.fee*.8)}</b></div>`:''}<div class="between" style="border-top:1px solid var(--line);padding-top:8px"><b>Patient pays</b><b style="font-size:18px">${rs(ins&&c.verify===2?(c.payer==='Sehat Card'?0:d.fee*.2):d.fee)}</b></div></div>
  <span class="lbl" style="margin-top:14px">When to collect</span><div class="row" style="gap:6px"><button class="pill ${!c.payNow?'on':''}" data-a="ciPayNow" data-v="0">After consultation</button><button class="pill ${c.payNow?'on':''}" data-a="ciPayNow" data-v="1">Now (advance)</button></div>`;}
 if(c.step===4){const d=DOCS[c.doc],q=Q.find(x=>x.token===c.token),p=pt(q.mrn);const ahead=Q.filter(x=>x.doc===c.doc&&['waiting','vitals','ready'].includes(x.status)&&x.id!==q.id).length;

 const canNext=c.step===1?(c.isNew?c.np.name.trim().length>1&&c.np.phone.replace(/\D/g,'').length>=10:!!c.mrn):c.step===2?c.consent:c.step===3?(c.payer==='Self-pay'||c.verify===2):true;
 return mhead(title,`Step ${c.step} of 4 · ${labels[c.step-1]}`)+bar+body+`<div class="between" style="margin-top:20px">${c.step>1&&c.step<4?'<button class="btn" data-a="ciBack">Back</button>':'<span></span>'}${c.step<4?`<button class="btn pri lg" data-a="ciNext" ${canNext?'':'disabled'}>${c.step===3?'Issue token':'Continue'}</button>`:'<button class="btn pri lg" data-a="ciDone">Done</button>'}</div>`;
};

 if(c.step===3){let mrn=c.mrn;if(c.isNew){mrn='CC-'+(10480+DIR.length);DIR.push({mrn,name:c.np.name.trim(),age:+c.np.age||30,sex:c.np.sex[0],phone:c.np.phone,cnic:'Pending',payer:c.payer,addr:'—'})}
  let q=c.apptId?Q.find(x=>x.id===c.apptId):null;

A.tvLang=v=>{S.tvLang=v;render()};
A.replay=()=>{if(!S.lastCall){toast('No one has been called yet');return}S.lastCall.at=Date.now();render();toast('Announcement repeated: '+S.lastCall.token)};
A.fullscreen=()=>{const el=document.getElementById('tvscreen');try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(_){toast('Full screen is not available in this browser')}};
</script>
<script>
/* ===== BILLING ===== */
const CAT=[['ECG',800],['BP & sugar check',200],['Injection (IM)',300],['Nebulisation',400],['Wound dressing',500],['CBC — Chughtai Lab',950],['Ultrasound (OB)',2500],['Medical certificate',500]];
const DISC={None:0,'Senior citizen 10%':.1,'Welfare / Zakat 50%':.5,'Staff family 100%':1};
const METHODS=[['Cash','money'],['JazzCash','wallet'],['Easypaisa','wallet'],['Card','wallet'],['Insurance claim','shield']];
function invoice(q){const d=DOCS[q.doc];const items=q.items||[];const sub=items.reduce((a,i)=>a+i[1],0);
 const ins=q.payer&&q.payer!=='Self-pay'?q.payer:null;const cover=ins?(ins==='Sehat Card'?items[0]?items[0][1]:0:Math.round((items[0]?items[0][1]:0)*.8)):0;
 const disc=Math.round((sub-cover)*DISC[S.disc]);const total=Math.max(0,sub-cover-disc-(q.prepaid?d.fee:0));return {items,sub,ins,cover,disc,total,pre:q.prepaid?d.fee:0}}
V.billing=()=>{const due=Q.filter(q=>q.status==='billing');const paid=Q.filter(q=>q.status==='done'&&q.paid);
 if(S.bill&&!due.find(q=>q.id===S.bill))S.bill=null;if(!S.bill&&due.length)S.bill=due[0].id;
 const q=due.find(x=>x.id===S.bill);
 let inv='';
 if(q){const p=pt(q.mrn),v=invoice(q);const cash=+S.cashIn.replace(/\D/g,'')||0;
  inv=`<section class="card stack" style="flex:2 1 520px;padding:20px;gap:14px;min-width:0"><div class="between wrap"><div class="row"><span class="token" style="font-size:22px;color:${DOCS[q.doc].col}">${q.token}</span><div><b style="font-size:16px">${esc(p.name)}</b><div class="muted sm">${p.mrn} · ${DOCS[q.doc].name} · ${q.payer||p.payer}</div></div></div><span class="chip md">Invoice INV-${String(q.id).slice(-5)}</span></div>
  <div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">${v.items.map((it,i)=>`<div class="between" style="padding:10px 14px;border-bottom:1px solid #F2F4F7"><span>${it[0]}</span><span class="row"><b>${rs(it[1])}</b>${i?`<button class="btn sm ico ghost" aria-label="Remove ${esc(it[0])}" data-a="rmItem" data-v="${i}">${I('x',14)}</button>`:'<span style="width:34px"></span>'}</span></div>`).join('')}
   <div style="padding:10px 14px;background:#F8FAFC"><div class="lbl">Add service</div><div class="row wrap" style="gap:6px">${CAT.map((c,i)=>`<button class="pill" data-a="addItem" data-v="${i}">+ ${c[0]} · ${rs(c[1])}</button>`).join('')}</div></div></div>
  <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div><label class="lbl" for="disc">Discount</label>${sel('disc',Object.keys(DISC),S.disc,'data-a="disc"')}</div><div><label class="lbl" for="payer">Payer</label>${sel('payer',['Self-pay','Sehat Card','State Life','Jubilee Health','EFU Health','Corporate panel'],q.payer||p.payer,'data-a="payer"')}</div></div>
  <div class="stack" style="gap:6px;background:#F8FAFC;border-radius:12px;padding:14px"><div class="between"><span>Subtotal</span><b>${rs(v.sub)}</b></div>${v.cover?`<div class="between" style="color:#067647"><span>${v.ins} covers</span><b>− ${rs(v.cover)}</b></div>`:''}${v.disc?`<div class="between" style="color:#067647"><span>${S.disc}</span><b>− ${rs(v.disc)}</b></div>`:''}${v.pre?`<div class="between" style="color:#067647"><span>Advance paid at check-in</span><b>− ${rs(v.pre)}</b></div>`:''}<div class="between" style="border-top:1px solid var(--line);padding-top:8px"><b style="font-size:16px">Patient pays</b><b style="font-size:26px;font-family:'Plus Jakarta Sans'">${rs(v.total)}</b></div></div>
  <div><span class="lbl">Payment method</span><div class="row wrap" style="gap:6px">${METHODS.map(m=>`<button class="pill ${S.payMethod===m[0]?'on':''}" data-a="pmethod" data-v="${m[0]}">${I(m[1],15)}${m[0]}</button>`).join('')}</div></div>
  ${S.payMethod==='Cash'?`<div class="row wrap" style="gap:12px;align-items:flex-end"><div style="flex:1 1 180px"><label class="lbl" for="cashin">Cash received</label><input id="cashin" class="inp" inputmode="numeric" placeholder="${v.total}" value="${esc(S.cashIn)}" data-i="cashIn"></div><div class="row wrap" style="gap:6px">${[v.total,Math.ceil(v.total/1000)*1000,5000].filter((x,i,a)=>x>0&&a.indexOf(x)===i).map(x=>`<button class="pill" data-a="cashQuick" data-v="${x}">${rs(x)}</button>`).join('')}</div><div style="flex:1 1 140px;background:${cash>=v.total?'#ECFDF3':'#F8FAFC'};border-radius:12px;padding:10px 14px"><div class="muted sm">Change to return</div><b style="font-size:20px">${cash?rs(Math.max(0,cash-v.total)):'—'}</b></div></div>`:S.payMethod==='JazzCash'||S.payMethod==='Easypaisa'?`<div class="row" style="background:#F8FAFC;border-radius:12px;padding:12px">${I('wallet',20)}<div class="sm">A payment request for <b>${rs(v.total)}</b> will be sent to <b>${p.phone}</b>. The patient approves it with their ${S.payMethod} MPIN.</div></div>`:S.payMethod==='Card'?`<div class="row" style="background:#F8FAFC;border-radius:12px;padding:12px">${I('wallet',20)}<div class="sm">Ask the patient to tap or insert their card on the POS machine.</div></div>`:`<div class="row" style="background:#F8FAFC;border-radius:12px;padding:12px">${I('shield',20)}<div class="sm">The full amount is submitted as a claim to ${v.ins||'the insurer'}. You'll be able to track it in Day close → Claims.</div></div>`}
  <button class="btn pri lg" data-a="pay" ${S.payMethod==='Cash'&&v.total>0&&cash<v.total?'disabled':''}>${v.total===0?'Close invoice (nothing to pay)':S.payMethod==='Cash'?'Complete payment · '+rs(v.total):S.payMethod==='Insurance claim'?'Submit claim':'Send request · '+rs(v.total)}</button></section>`;}
 return `<div class="row wrap" style="gap:16px;align-items:flex-start"><aside class="stack" style="flex:1 1 300px;gap:16px;min-width:0"><section class="card stack" style="padding:16px;gap:8px"><div class="between"><h3 class="sec">To collect</h3><span class="chip md">${due.length}</span></div>
 ${due.map(x=>`<button class="row" data-a="selBill" data-v="${x.id}" style="border:1px solid ${S.bill===x.id?'#0B7A75':'var(--line)'};background:${S.bill===x.id?'#F0FAF9':'#fff'};border-radius:12px;padding:10px 12px;text-align:left"><span class="token" style="width:64px;color:${DOCS[x.doc].col}">${x.token}</span><span style="flex:1"><b>${esc(pt(x.mrn).name)}</b><span class="muted sm" style="display:block">${DOCS[x.doc].name}</span></span><b>${rs(invoice(x).total)}</b></button>`).join('')||'<div class="muted sm" style="padding:20px;text-align:center;background:#F8FAFC;border-radius:10px">Nobody waiting to pay. Patients appear here when the doctor finishes.</div>'}</section>
 <section class="card stack" style="padding:16px;gap:8px"><div class="between"><h3 class="sec">Paid today</h3><span class="muted sm">${paid.length}</span></div>${paid.map(x=>`<div class="row" style="padding:6px 0;border-bottom:1px solid #F2F4F7"><span class="token sm" style="width:56px">${x.token}</span><span class="sm" style="flex:1">${esc(pt(x.mrn).name)}</span><span class="chip neu">${x.method}</span><b class="sm">${rs(x.amt)}</b><button class="btn sm ico ghost" aria-label="Reprint receipt" data-a="receipt" data-v="${x.id}">${I('printer',14)}</button></div>`).join('')}</section></aside>
 ${inv||'<section class="card" style="flex:2 1 520px;padding:40px;text-align:center" class="muted">Select a patient to open their invoice.</section>'}</div>`;
};
A.selBill=v=>{S.bill=+v;S.cashIn='';S.disc='None';render()};
A.addItem=v=>{const q=Q.find(x=>x.id===S.bill);q.items.push(CAT[+v].slice());render()};
A.rmItem=v=>{const q=Q.find(x=>x.id===S.bill);q.items.splice(+v,1);render()};
A.disc=(v,el)=>{S.disc=el.value;render()};A.payer=(v,el)=>{Q.find(x=>x.id===S.bill).payer=el.value;render()};
A.pmethod=v=>{S.payMethod=v;render()};A.cashQuick=v=>{S.cashIn=String(v);render()};
A.pay=()=>{const q=Q.find(x=>x.id===S.bill),v=invoice(q);const go2=()=>{q.status='done';q.paid=true;q.amt=S.payMethod==='Insurance claim'?0:v.total;q.method=S.payMethod==='Insurance claim'?'Claim':S.payMethod;q.change=Math.max(0,(+S.cashIn||0)-v.total);if(S.payMethod==='Insurance claim'||v.cover)S.claims.unshift(['CL-'+(2292+S.claims.length),pt(q.mrn).name,v.ins||q.payer||'Insurer',rs(v.cover||v.sub),'Submitted']);S.recId=q.id;S.cashIn='';S.disc='None';S.modal='receipt';render()};
 if(S.payMethod==='JazzCash'||S.payMethod==='Easypaisa'){toast('Waiting for patient to approve on '+S.payMethod+'…');setTimeout(go2,1200)}else go2()};
A.receipt=v=>{S.recId=+v;S.modal='receipt';renderOv()};
M.receipt=()=>{const q=Q.find(x=>x.id===S.recId),p=pt(q.mrn);return mhead('Payment received',`${q.token} · ${esc(p.name)}`)+`<div class="slip" style="margin-top:16px;text-align:left"><div style="text-align:center;font-weight:700">SHIFA FAMILY CLINIC</div><div style="text-align:center">F-8 Markaz, Islamabad · NTN 1234567-8</div><div style="margin:8px 0;border-top:1px dashed #98A2B3"></div><div>Receipt: RCP-${String(q.id).slice(-6)}</div><div>Date: 16-Nov-2026 ${hm(nowMin())}</div><div>Patient: ${esc(p.name)} (${p.mrn})</div><div>Doctor: ${DOCS[q.doc].name}</div><div style="margin:8px 0;border-top:1px dashed #98A2B3"></div>${(q.items||[]).map(i=>`<div style="display:flex;justify-content:space-between"><span>${i[0].replace('Consultation — ','Consult ')}</span><span>${i[1].toLocaleString()}</span></div>`).join('')}<div style="margin:8px 0;border-top:1px dashed #98A2B3"></div><div style="display:flex;justify-content:space-between;font-weight:700"><span>PAID (${q.method})</span><span>Rs ${(q.amt||0).toLocaleString()}</span></div>${q.change?`<div style="display:flex;justify-content:space-between"><span>Change</span><span>Rs ${q.change.toLocaleString()}</span></div>`:''}<div style="margin:8px 0;border-top:1px dashed #98A2B3"></div><div style="text-align:center">Thank you · شکریہ</div></div>
 <div class="row wrap" style="gap:8px;justify-content:center;margin-top:16px"><button class="btn" data-a="toast" data-v="Receipt sent to printer">${I('printer',18)}Print</button><button class="btn" data-a="toast" data-v="Receipt sent by SMS & WhatsApp to ${p.phone}">${I('sms',18)}SMS / WhatsApp</button><button class="btn pri" data-a="closeModal">Done</button></div>`};

/* ===== DAY CLOSE ===== */
V.closing=()=>{const done=Q.filter(q=>q.status==='done'&&q.paid);const by={};done.forEach(q=>{by[q.method]=(by[q.method]||0)+(q.amt||0)});
 const total=Object.values(by).reduce((a,b)=>a+b,0);const float=5000,expected=float+(by.Cash||0);const counted=+String(S.closing.counted).replace(/\D/g,'')||0;const varc=counted-expected;
 const seen=Q.filter(q=>['done','billing','consult'].includes(q.status)).length,ns=Q.filter(q=>q.status==='noshow').length,walk=Q.filter(q=>q.type==='Walk-in').length;
 return `${S.closing.closed?`<div class="card row" style="padding:14px 16px;background:#ECFDF3;border-color:#ABEFC6">${I('check',20,'#067647',2.4)}<b>Shift closed at ${hm(nowMin())}.</b><span class="muted">Summary sent to Dr. Ayesha Malik.</span></div>`:''}
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${[['users','tl',seen,'Patients seen'],['plus','md',walk,'Walk-ins'],['alert','hi',ns,'No-shows'],['money','pu',rs(total),'Collected']].map(k=>`<div class="card row" style="padding:16px"><span class="icob ${k[1]}">${I(k[0])}</span><div><div style="font-size:22px;font-weight:700;font-family:'Plus Jakarta Sans'">${k[2]}</div><div class="muted sm">${k[3]}</div></div></div>`).join('')}</div>
 <div class="row wrap" style="gap:16px;align-items:flex-start"><section class="card stack" style="flex:1 1 360px;padding:18px;gap:10px"><h3 class="sec">Collections by method</h3>${['Cash','JazzCash','Easypaisa','Card','Paid in app','Claim'].map(m=>`<div class="between" style="padding:8px 0;border-bottom:1px solid #F2F4F7"><span>${m}</span><b>${rs(by[m]||0)}</b></div>`).join('')}<div class="between"><b>Total</b><b style="font-size:18px">${rs(total)}</b></div></section>
 <section class="card stack" style="flex:1 1 360px;padding:18px;gap:12px"><h3 class="sec">Cash drawer</h3><div class="between"><span>Opening float</span><b>${rs(float)}</b></div><div class="between"><span>Cash payments</span><b>${rs(by.Cash||0)}</b></div><div class="between" style="border-top:1px solid var(--line);padding-top:8px"><b>Expected in drawer</b><b>${rs(expected)}</b></div>
 <div><label class="lbl" for="cnt">Counted cash</label><input id="cnt" class="inp" inputmode="numeric" placeholder="Count notes and enter total" value="${esc(S.closing.counted)}" data-i="closing.counted" ${S.closing.closed?'disabled':''}></div>
 ${counted?`<div class="row" style="background:${varc===0?'#ECFDF3':'#FEF3F2'};border-radius:12px;padding:12px">${I(varc===0?'check':'alert',20,varc===0?'#067647':'#B42318')}<b>${varc===0?'Drawer balanced':'Difference: '+(varc>0?'+':'−')+rs(Math.abs(varc))}</b>${varc!==0?'<span class="muted sm">Add a note for the owner</span>':''}</div>`:''}
 <button class="btn pri lg" data-a="openModal2" data-v="closeShift" ${counted&&!S.closing.closed?'':'disabled'}>Close shift</button></section>
 <section class="card" style="flex:1 1 360px;overflow:hidden"><div class="between" style="padding:14px 16px"><h3 class="sec">Insurance claims</h3><span class="muted sm">Sehat Card & panels</span></div><div class="scroll"><table class="tbl"><thead><tr><th>Claim</th><th>Patient</th><th>Payer</th><th>Amount</th><th>Status</th></tr></thead><tbody>${S.claims.map(c=>`<tr><td class="sm">${c[0]}</td><td class="sm">${c[1]}</td><td class="sm">${c[2]}</td><td class="sm b">${c[3]}</td><td><span class="chip ${c[4]==='Approved'?'lo':c[4]==='Query raised'?'hi':'info'}">${c[4]}</span></td></tr>`).join('')}</tbody></table></div></section></div>`;
};
A.openModal2=v=>{S.modal=v;renderOv()};
M.closeShift=()=>mhead('Close shift?')+`<p class="muted" style="margin:10px 0 16px">This locks today's collections and sends the summary to the clinic owner. You won't be able to edit payments after closing.</p><label class="lbl" for="cnote">Note for the owner (optional)</label><textarea id="cnote" class="inp" rows="3" placeholder="e.g. Rs 500 short — change given twice to token A-012"></textarea><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doClose">Close shift</button></div>`;
A.doClose=()=>{S.closing.closed=true;S.modal=null;render();toast('Shift closed · summary sent to Dr. Ayesha Malik')};

/* ===== events ===== */
A.toast=v=>toast(v);
function setPath(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(!a)return;if(a.tagName==='SELECT')return;
 if(a.dataset.a==='closeModal'&&a.classList.contains('bg')&&(e.target.closest('[data-stop]')||S.modal==='lock'))return;
 const f=A[a.dataset.a];if(f)f(a.dataset.v,a)});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.a&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el)});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.i)return;setPath(el.dataset.i,el.value);if(el.dataset.norender)return;const id=el.id,pos=el.selectionStart;if(S.modal)renderOv();else render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal&&S.modal!=='lock'){S.modal=null;S.ci=null;render()}});
/* drag cards between columns */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c){dragId=+c.dataset.drag;try{e.dataTransfer.setData('text/plain',String(dragId))}catch(_){}}});
document.addEventListener('dragover',e=>{if(dragId&&e.target.closest('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop]');if(!dragId||!col)return;e.preventDefault();const q=Q.find(x=>x.id===dragId),to=col.dataset.drop;dragId=null;if(!q||q.status===to||(to==='waiting'&&q.status==='vitals'))return;
 if(to==='done'&&q.status!=='billing'){toast('Collect payment first — move to Billing');return}
 if(to==='consult'){advance(q,'consult');render();toast(`Calling ${q.token} to ${DOCS[q.doc].room}`);return}
 if(to==='billing'){toBilling(q);render();return}if(to==='done'){S.bill=q.id;go('billing');return}q.status=to;render()});
/* live clock & TV tick */
setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=hm(nowMin());const t=document.getElementById('tvclk');if(t){t.textContent=hm(nowMin());const tip=document.getElementById('tvtip');if(tip)tip.textContent=TIPS[Math.floor((Date.now()-T0)/8000)%TIPS.length]}},1000);
let lastMin=nowMin();setInterval(()=>{if(nowMin()!==lastMin){lastMin=nowMin();if(!S.modal&&S.page==='board')render()}},2000);
render();
</script>
</body>
</html>
