<title>CareConnect · Platform admin prototype</title>

<style>
:root{--teal:#0B7A75;--teal-d:#075E5A;--teal-50:#E6F4F3;--navy:#0E2233;--ink:#0F1B2D;--muted:#5B6B7F;--line:#E3E8EF;--bg:#F3F6F9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',Inter,sans-serif;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
.sidebar{flex:1 1 236px;max-width:260px;background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1480px;width:100%}
@media (max-width:860px){.sidebar{max-width:none}.sidebar nav{flex-direction:row!important;flex-wrap:wrap}.sidebar .branch{display:none}.content{padding:16px}}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#C3D2DF;font-weight:500;min-height:44px;border:0;background:none;width:100%;text-align:left}
@media (max-width:860px){.nav{width:auto}}
.nav:hover{background:#17344A;color:#fff}
.nav.on{background:var(--teal);color:#fff}
.nav .bdg{margin-left:auto;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}
header.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid #D0D8E2;background:#fff;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal-d)}
.btn.dan{border-color:#FDA29B;color:#B42318}.btn.dan:hover{background:#FEF3F2}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#EEF2F6}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.ico{width:40px;padding:0}.btn.sm.ico{width:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5;border:0}
.hi{background:#FEE4E2;color:#B42318}.md{background:#FEF0C7;color:#93370D}.lo{background:#DCFAE6;color:#067647}.info{background:#E0F2FE;color:#075985}.neu{background:#EEF2F6;color:#364152}.tl{background:var(--teal-50);color:#0B5F5B}.pu{background:#EEF0FF;color:#3E3CB0}
.tabbar{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 2px;margin-right:22px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;min-height:44px;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.pill{border:1px solid #D0D8E2;background:#fff;color:#344054;border-radius:999px;padding:0 14px;min-height:34px;font-weight:600;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--teal)}.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.inp{height:40px;border:1px solid #D0D8E2;border-radius:10px;padding:0 12px;background:#fff;width:100%}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.inp:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.lbl{font-size:12px;font-weight:600;color:#475467;display:block;margin-bottom:6px}
.muted{color:var(--muted)}.sm{font-size:12px}.b{font-weight:600}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid #EEF2F6;vertical-align:middle}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:#F5FAFA}.tbl tr.sel td{background:var(--teal-50)}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.icob{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sec{font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans'}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

.lnk{background:none;border:0;padding:0;color:var(--teal);font-weight:600;font-size:13px;text-decoration:none}
.lnk:hover{text-decoration:underline}
.chk{width:18px;height:18px;accent-color:var(--teal);cursor:pointer;flex:none}
.bar{background:#EEF2F6;border-radius:999px;height:8px;overflow:hidden}.bar>div{height:100%;border-radius:999px;background:var(--teal)}
.scroll{overflow-x:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bg{position:fixed;inset:0;background:rgba(15,27,45,.48);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal{background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 24px 64px rgba(15,27,45,.25)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:500;z-index:60;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;padding:6px;box-shadow:0 12px 32px rgba(15,27,45,.14)}
.sug button{display:flex;width:100%;gap:10px;align-items:center;padding:10px;border:0;background:transparent;border-radius:8px;text-align:left;min-height:44px}
.sug button:hover{background:#F3F6F9}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.vidbtn{width:52px;height:52px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;color:#fff}
</style>
<style>
.sidebar{background:#0B1622}
.nav.on{background:#0B7A75}
.drawer-bg{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:#fff;width:100%;max-width:640px;height:100%;overflow:auto;padding:24px;box-shadow:-20px 0 50px rgba(15,27,45,.2)}

 <h4 class="sec" style="margin-top:18px;font-size:14px">Recent invoices</h4><table class="tbl" style="margin-top:6px"><tbody>${['Nov','Oct','Sep'].map((m,i)=>`<tr><td class="sm">INV-${2210-i*31} · ${m} 2026</td><td class="sm b">${rs(PLANS[c.plan].price)}</td><td><span class="chip ${c.status==='Suspended'&&i<2?'hi':'lo'}">${c.status==='Suspended'&&i<2?'Overdue':'Paid'}</span></td></tr>`).join('')}</tbody></table>
 <h4 class="sec" style="margin-top:18px;font-size:14px">Actions</h4><div class="row wrap" style="gap:8px;margin-top:8px"><button class="btn" data-a="loginAs" data-v="${c.id}">${I('eye',16)}View as clinic (support)</button><button class="btn" data-a="toast" data-v="Message sent to ${esc(c.owner)} by email and SMS">${I('chat',16)}Message owner</button>${c.status==='Trial'?`<button class="btn" data-a="extendTrial" data-v="${c.id}">Extend trial 14 days</button>`:''}${c.status==='Suspended'?`<button class="btn pri" data-a="reactivate" data-v="${c.id}">Reactivate</button>`:`<button class="btn dan" data-a="openSuspend" data-v="${c.id}">Suspend</button>`}</div>
 <p class="muted sm" style="margin-top:12px">Patients never lose access to their own records, even if a clinic is suspended.</p>`};
A.clStatus=v=>{S.cl.status=v;render()};
A.openClinic=v=>{S.drawer={t:'clinic',id:v};renderOv()};
A.setPlan=v=>{const [id,p]=v.split(':'),c=CLINICS.find(x=>x.id===id);if(c.plan===p)return;const old=c.plan;c.plan=p;audit('You (Super admin)','Changed plan',`${c.name}: ${old} → ${p}`);render();toast(`${c.name} moved to ${p} · prorated invoice created`)};
A.extendTrial=v=>{const c=CLINICS.find(x=>x.id===v);c.pay='Trial ends 12 Dec';audit('You (Super admin)','Extended trial',c.name);render();toast('Trial extended to 12 Dec')};
A.reactivate=v=>{const c=CLINICS.find(x=>x.id===v);c.status='Active';c.pay='Payment plan agreed';c.health=55;audit('You (Super admin)','Reactivated',c.name);render();toast(c.name+' reactivated · staff can log in again')};
A.openSuspend=v=>{S.susp=v;S.modal='suspend';renderOv()};
M.suspend=()=>{const c=CLINICS.find(x=>x.id===S.susp);return mhead('Suspend '+c.name+'?')+`<p class="muted" style="margin:10px 0 14px">Staff will be logged out and can't use the clinic tools. Patients can still see their records and are told to contact the clinic.</p><label class="lbl" for="sr">Reason (shared with the owner)</label>${sel('sr',['Unpaid invoices','Policy violation','Unverified doctors practising','Requested by owner'])}<label class="lbl" for="sn" style="margin-top:12px">Internal note</label><textarea id="sn" class="inp" rows="3"></textarea><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn dan" data-a="doSuspend">Suspend clinic</button></div>`};
A.doSuspend=()=>{const c=CLINICS.find(x=>x.id===S.susp);c.status='Suspended';c.health=30;audit('You (Super admin)','Suspended',c.name+' · '+document.getElementById('sr').value);S.modal=null;render();toast(c.name+' suspended · owner notified')};
A.loginAs=v=>{const c=CLINICS.find(x=>x.id===v);S.comp.access.unshift({id:'A-'+(89+S.comp.access.length),who:'You (Super admin)',org:c.name,why:'Opened from clinic profile',dur:'30 min',status:'Pending'});S.drawer=null;go('compliance');S.comp.tab='access';render();toast('Access request created — needs a second approver (Compliance)')};
</script>
<script>
/* ================= ONBOARDING ================= */
const STAGES=['Applied','Documents','Verification','Training','Live'];
V.onboarding=()=>`<div class="between wrap"><p class="muted">Move clinics through onboarding. Drag cards or use the arrow buttons. A clinic can only go live once its doctors are PMDC-verified.</p><button class="btn pri" data-a="openModal" data-v="newClinic">${I('plus',16)}Add clinic manually</button></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px">${STAGES.map(st=>{const it=S.onb.filter(o=>o.stage===st);return `<div class="kcol" data-drop="${st}"><div class="between" style="padding:2px 4px"><b>${st}</b><span class="chip neu" style="background:#fff">${it.length}</span></div>
 ${it.map(o=>`<div class="kcard" draggable="true" data-drag="${o.id}"><div class="between"><b>${o.name}</b></div><div class="muted sm">${o.city} · ${o.owner}</div><div class="row wrap" style="gap:6px"><span class="chip ${PLANS[o.plan].c}">${o.plan}</span><span class="chip ${o.docs==='4/4'?'lo':'md'}">Docs ${o.docs}</span></div><div class="sm">${o.note}</div>
 <div class="row wrap" style="gap:6px">${st!=='Applied'?`<button class="btn sm ico" aria-label="Move back" data-a="onbMove" data-v="${o.id}:-1">${I('chevl',15)}</button>`:''}${st==='Documents'?`<button class="btn sm" data-a="onbChase" data-v="${o.id}">Chase docs</button>`:''}${st==='Verification'?`<button class="btn sm" data-go="verify">Check doctors</button>`:''}${st==='Live'?'<span class="chip lo">Live</span>':`<button class="btn sm pri" style="margin-left:auto" data-a="onbMove" data-v="${o.id}:1">${st==='Training'?'Go live':'Next'} ${I('chevr',14)}</button>`}</div></div>`).join('')||'<div class="muted sm" style="text-align:center;padding:20px">Drop here</div>'}</div>`}).join('')}</div>
 <section class="card stack" style="padding:18px;gap:10px"><h3 class="sec">What each stage checks</h3><div class="grid sm" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${[['Documents','Owner CNIC, PMDC certificates, provincial Healthcare Commission licence, clinic address proof'],['Verification','Every doctor’s PMDC number checked; clinic location confirmed by call'],['Training','1-hour video session for front desk and doctors, in Urdu or English'],['Live','Clinic appears in patient search; bookings and payments switched on']].map(x=>`<div style="background:#F8FAFC;border-radius:12px;padding:12px"><b>${x[0]}</b><div class="muted">${x[1]}</div></div>`).join('')}</div></section>`;
A.onbMove=v=>{const [id,d]=v.split(':'),o=S.onb.find(x=>x.id===id),i=STAGES.indexOf(o.stage)+ +d;if(i<0||i>=STAGES.length)return;
 if(STAGES[i]==='Live'&&o.docs!=='4/4'){toast('Documents incomplete — cannot go live yet');return}
 if(STAGES[i]==='Training'&&o.name==='Bahawalpur Eye Clinic'&&S.docs.find(x=>x.id==='d3').status!=='Verified'){toast('Dr. Usama Qadri’s PMDC registration is not verified yet');return}
 o.stage=STAGES[i];if(o.stage==='Live'){CLINICS.push({id:'c'+(CLINICS.length+1),name:o.name,city:o.city,owner:o.owner,phone:'—',plan:o.plan,status:'Trial',docs:2,staff:3,patients:0,consults:0,since:'Nov 2026',branches:1,health:60,pay:'Trial ends 30 Dec',last:'Today'});audit('You (Super admin)','Took live',o.name)}
 render();toast(o.stage==='Live'?o.name+' is live · welcome SMS sent':'Moved to '+o.stage)};
A.onbChase=v=>{const o=S.onb.find(x=>x.id===v);toast('Reminder sent to '+o.owner+' with upload link')};
M.newClinic=()=>mhead('Add clinic','Creates an application in “Applied”')+`<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px"><div style="grid-column:span 2"><label class="lbl" for="ncn">Clinic name</label><input id="ncn" class="inp" placeholder="e.g. Sukkur Family Clinic"></div><div><label class="lbl" for="nco">Owner doctor</label><input id="nco" class="inp" placeholder="Dr. …"></div><div><label class="lbl" for="ncp">Owner mobile</label><input id="ncp" class="inp" placeholder="03XX XXXXXXX"></div><div><label class="lbl" for="ncc">City</label>${sel('ncc',['Sukkur','Islamabad','Lahore','Karachi','Peshawar','Quetta','Multan','Hyderabad','Faisalabad','Other'])}</div><div><label class="lbl" for="ncl">Plan</label>${sel('ncl',Object.keys(PLANS),'Starter')}</div></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn pri" data-a="saveClinic">Create application</button></div>`;
A.saveClinic=()=>{const g=id=>document.getElementById(id).value;S.onb.unshift({id:'o'+Date.now(),name:g('ncn')||'New clinic',city:g('ncc'),owner:g('nco')||'—',plan:g('ncl'),stage:'Applied',docs:'0/4',note:'Added manually · upload link sent by SMS'});S.modal=null;render();toast('Application created · upload link sent to owner')};

/* ================= DOCTOR VERIFICATION ================= */
V.verify=()=>{const v=S.ver;const list=S.docs.filter(d=>d.status===v.filter);const d=S.docs.find(x=>x.id===v.sel)||list[0];if(d)v.sel=d.id;
 const cnt=s=>S.docs.filter(x=>x.status===s).length;const lk=d&&v.lookup[d.id];const ck=d?(v.checks[d.id]=v.checks[d.id]||{}):{};
 const CK=['CNIC matches applicant','PMDC certificate is clear and readable','Degree matches specialty','Photo matches CNIC'];
 return `${tabs('verF',['Pending','Verified','Rejected'].map(s=>[s,s+` <span class="chip ${s==='Pending'?'md':'neu'}" style="margin-left:4px">${cnt(s)}</span>`]),v.filter)}
 <div class="row wrap" style="gap:20px;align-items:flex-start"><section class="card" style="flex:1 1 320px;overflow:hidden;min-width:0">${list.map(x=>`<button class="row" data-a="verSel" data-v="${x.id}" style="width:100%;padding:14px;border:0;border-bottom:1px solid #F2F4F7;background:${d&&d.id===x.id?'#E6F4F3':'#fff'};text-align:left"><span class="av pu">${ini(x.name)}</span><span style="flex:1;min-width:0"><b>${x.name}</b><span class="muted sm" style="display:block">${x.spec} · ${x.clinic}</span></span><span class="muted sm">${x.sub}</span></button>`).join('')||'<div class="muted" style="padding:30px;text-align:center">Nothing here.</div>'}</section>
 ${d?`<section class="card stack" style="flex:2 1 520px;padding:20px;gap:16px;min-width:0"><div class="between wrap"><div class="row"><span class="av pu" style="width:52px;height:52px;font-size:17px">${ini(d.name)}</span><div><b style="font-size:18px">${d.name}</b><div class="muted sm">${d.spec} · ${d.clinic} · submitted ${d.sub}</div></div></div><span class="chip ${d.status==='Verified'?'lo':d.status==='Rejected'?'hi':'md'}">${d.status}</span></div>
 <div class="grid sm" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div><div class="muted">PMDC registration</div><b>${d.pmdc}</b></div><div><div class="muted">CNIC</div><b>${d.cnic}</b></div><div><div class="muted">Qualification</div><b>${d.deg}</b></div></div>
 <div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">${['CNIC front','CNIC back','PMDC certificate','Degree'].map(t=>`<button class="docthumb" data-a="toast" data-v="Opening ${t} (zoomable viewer)">${I('file',16)} ${t}</button>`).join('')}</div>
 <div class="card stack" style="padding:14px;gap:10px;background:#F8FAFC"><div class="between"><b>PMDC register check</b>${lk?'':`<button class="btn sm pri" data-a="lookup" data-v="${d.id}" ${d.pmdc==='—'?'disabled':''}>${I('refresh',15)}Check PMDC record</button>`}</div>
 ${lk==='loading'?'<div class="muted sm">Checking the PMDC register…</div>':lk?`<div class="grid sm" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div><span class="muted">Name on register</span><br><b>${d.result==='mismatch'?'Dr. Hassan Raza Khan':d.name}</b></div><div><span class="muted">Status</span><br><b style="color:${d.result==='expired'?'#B42318':'#067647'}">${d.result==='expired'?'Licence expired '+d.exp:'Valid until '+d.exp}</b></div><div><span class="muted">Registration type</span><br><b>${d.spec==='Dentist'?'BDS — Full':'MBBS — Full'}${/FCPS/.test(d.deg)?' + Specialist':''}</b></div><div><span class="muted">Result</span><br>${d.result==='match'?'<span class="chip lo">Match</span>':d.result==='expired'?'<span class="chip hi">Expired</span>':'<span class="chip md">Name differs — check CNIC</span>'}</div></div><div class="muted sm">This is a sample result. In production this would come from PMDC's online register.</div>`:'<div class="muted sm">Not checked yet.</div>'}</div>
 ${d.status==='Pending'?`<div><div class="lbl">Reviewer checklist</div>${CK.map((c,i)=>`<label class="row" style="padding:6px 0;cursor:pointer"><input type="checkbox" class="chk" ${ck[i]?'checked':''} data-a="ck" data-v="${d.id}:${i}">${c}</label>`).join('')}</div>
 <div class="row wrap"><button class="btn pri" data-a="verApprove" data-v="${d.id}" ${lk&&lk!=='loading'&&d.result==='match'&&CK.every((c,i)=>ck[i])?'':'disabled'}>${I('check',16)}Approve & verify</button><button class="btn" data-a="verInfo" data-v="${d.id}">Request more info</button><button class="btn dan" data-a="verReject" data-v="${d.id}">Reject</button></div>
 <p class="muted sm">Approve unlocks once the PMDC record matches and all 4 checks are ticked. Verified doctors get a badge in patient search.</p>`:`<div class="muted sm">${d.status==='Verified'?'Verified. Re-check is scheduled 30 days before the licence expires.':'Rejected — the clinic was told and the doctor cannot see patients.'}</div>`}</section>`:''}</div>`;
};
A.verF=v=>{S.ver.filter=v;S.ver.sel=null;render()};A.verSel=v=>{S.ver.sel=v;render()};
A.lookup=v=>{S.ver.lookup[v]='loading';render();setTimeout(()=>{S.ver.lookup[v]='done';render()},800)};
A.ck=v=>{const [id,i]=v.split(':');S.ver.checks[id][i]=!S.ver.checks[id][i];render()};
A.verApprove=v=>{const d=S.docs.find(x=>x.id===v);d.status='Verified';audit('You (Super admin)','Verified doctor',d.name+' · PMDC '+d.pmdc);S.ver.sel=null;render();toast(d.name+' verified · clinic and doctor notified')};
A.verInfo=v=>{const d=S.docs.find(x=>x.id===v);toast('Asked '+d.name+' to upload a renewed PMDC certificate')};
A.verReject=v=>{S.rej=v;S.modal='reject';renderOv()};
M.reject=()=>{const d=S.docs.find(x=>x.id===S.rej);return mhead('Reject '+d.name+'?')+`<label class="lbl" for="rr" style="margin-top:12px">Reason (sent to the clinic)</label>${sel('rr',['PMDC licence expired','Name does not match PMDC register','Documents unclear','Not a registered medical practitioner'],d.result==='expired'?'PMDC licence expired':d.result==='mismatch'?'Name does not match PMDC register':'Documents unclear')}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn dan" data-a="doReject">Reject</button></div>`};
A.doReject=()=>{const d=S.docs.find(x=>x.id===S.rej);d.status='Rejected';audit('You (Super admin)','Rejected doctor',d.name+' · '+document.getElementById('rr').value);S.modal=null;S.ver.sel=null;render();toast(d.name+' rejected · clinic informed')};

/* ================= PLANS & BILLING ================= */
const FEAT=[['Doctor seats','1','3','10','Unlimited'],['Patients','50','Unlimited','Unlimited','Unlimited'],['Appointments & reminders','✓','✓','✓','✓'],['Patient app & family accounts','✓','✓','✓','✓'],['Video consultations','—','✓','✓','✓'],['Live Urdu ⇄ English translation','—','—','✓','✓'],['AI notes & care-plan suggestions','—','—','✓','✓'],['Campaigns & CareBot','—','—','✓','✓'],['Multiple branches','—','—','2','Unlimited'],['Analytics & finance dashboards','Basic','Basic','Full','Full + API'],['Support','Email','WhatsApp','Priority','Dedicated manager']];
const INV=[['INV-2241','Al-Noor Medical Centre','Enterprise','Rs 65,000','Paid','Bank transfer'],['INV-2240','Shifa Family Clinic','Pro','Rs 14,999','Paid','Card'],['INV-2239','Peshawar Heart & Diabetes Centre','Pro','Rs 14,999','Paid','JazzCash'],['INV-2238','Rawalpindi Bone & Joint','Pro','Rs 14,999','Failed','Card expired'],['INV-2237','Karachi Kids Clinic','Starter','Rs 4,999','Paid','Easypaisa'],['INV-2209','Faisalabad General Clinic','Pro','Rs 14,999','Failed','Insufficient funds'],['INV-2178','Faisalabad General Clinic','Pro','Rs 14,999','Failed','Insufficient funds']];
V.billing=()=>{const t=S.subTab;const head=tabs('subTab',[['plans','Plans'],['invoices','Invoices'],['failed','Failed payments','3']],t);
 if(t==='plans')return head+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${Object.keys(PLANS).map(p=>{const n=CLINICS.filter(c=>c.plan===p&&c.status!=='Suspended').length;return `<div class="card stack" style="padding:18px;gap:8px;${p==='Pro'?'border-color:#0B7A75':''}"><div class="between"><span class="chip ${PLANS[p].c}">${p}</span>${p==='Pro'?'<span class="chip tl">Most popular</span>':''}</div><div style="font-size:26px;font-weight:700;font-family:'Plus Jakarta Sans'">${p==='Enterprise'?'Custom':rs(PLANS[p].price)}<span class="muted sm" style="font-weight:500">${p==='Enterprise'?'':' / month'}</span></div><div class="muted sm">${PLANS[p].docs} doctor seat${PLANS[p].docs===1?'':'s'} · ${n} clinics on this plan</div><button class="btn sm" data-a="editPlan" data-v="${p}">Edit price</button></div>`}).join('')}</div>
 <section class="card" style="overflow:hidden"><div class="between" style="padding:14px 16px"><h3 class="sec">What's included</h3><span class="muted sm">Online consult fees: 5% platform commission on all plans</span></div><div class="scroll"><table class="tbl"><thead><tr><th>Feature</th>${Object.keys(PLANS).map(p=>`<th style="text-align:center">${p}</th>`).join('')}</tr></thead><tbody>${FEAT.map(f=>`<tr><td>${f[0]}</td>${f.slice(1).map(x=>`<td style="text-align:center;color:${x==='—'?'#98A2B3':'inherit'}" class="${x==='✓'?'b':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
 const rows=t==='failed'?INV.filter(i=>i[4]==='Failed'):INV;
 return head+`<section class="card" style="overflow:hidden"><div class="scroll"><table class="tbl"><thead><tr><th>Invoice</th><th>Clinic</th><th>Plan</th><th>Amount</th><th>Status</th><th>Method / reason</th><th></th></tr></thead><tbody>${rows.map(i=>{const fixed=S.failFix[i[0]];return `<tr><td class="sm b">${i[0]}</td><td>${i[1]}</td><td><span class="chip ${PLANS[i[2]].c}">${i[2]}</span></td><td class="b">${i[3]}</td><td><span class="chip ${fixed?'lo':i[4]==='Paid'?'lo':'hi'}">${fixed?'Paid (retried)':i[4]}</span></td><td class="sm muted">${fixed?'JazzCash link':i[5]}</td><td style="white-space:nowrap">${i[4]==='Failed'&&!fixed?`<button class="btn sm" data-a="retry" data-v="${i[0]}">Retry</button> <button class="btn sm" data-a="toast" data-v="Payment link sent to ${esc(i[1])} by SMS">Send pay link</button>`:`<button class="btn sm ghost" data-a="toast" data-v="${i[0]} PDF downloaded">${I('download',14)}PDF</button>`}</td></tr>`}).join('')}</tbody></table></div></section>
 ${t==='failed'?'<p class="muted sm">Clinics get 3 reminders over 10 days. After 14 days unpaid, the clinic is automatically suspended. Patients keep access to their records.</p>':''}`;
};
A.subTab=v=>{S.subTab=v;render()};
A.retry=v=>{S.failFix[v]=1;audit('You (Super admin)','Retried payment',v);render();toast(v+' collected successfully')};
A.editPlan=v=>{S.editP=v;S.modal='plan';renderOv()};
M.plan=()=>{const p=S.editP;return mhead('Edit '+p+' price')+`<label class="lbl" for="pp" style="margin-top:14px">Monthly price (Rs)</label><input id="pp" class="inp" inputmode="numeric" value="${PLANS[p].price}"><label class="row sm" style="margin-top:12px"><input type="checkbox" class="chk" checked>Keep current clinics on their old price for 3 months</label><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn pri" data-a="savePlan">Save</button></div>`};
A.savePlan=()=>{const p=S.editP,v=+document.getElementById('pp').value.replace(/\D/g,'')||PLANS[p].price;audit('You (Super admin)','Changed price',`${p}: ${rs(PLANS[p].price)} → ${rs(v)}`);PLANS[p].price=v;S.modal=null;render();toast(p+' price updated · clinics notified 30 days ahead')};

/* ================= PAYOUTS ================= */
const BATCH=[['Shifa Family Clinic','PK36 MEZN •••• 4471',184500],['Al-Noor Medical Centre','PK12 HABB •••• 0092',412300],['Karachi Kids Clinic','PK88 UNIL •••• 7710',96400],['Peshawar Heart & Diabetes Centre','PK41 BKIP •••• 3305',138900],['SkinCare Studio','PK90 MEZN •••• 1184',72100],['Rawalpindi Bone & Joint','PK07 ALFH •••• 5532',58800],['Quetta Family Health','PK55 NBPA •••• 2210',8400],['Multan Mother Care','—  (IBAN missing)',4200]];
V.payouts=()=>{const t=S.payTab;const head=tabs('payTab',[['Ready','Ready to approve'],['History','History']],t);
 if(t==='History')return head+`<section class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>Batch</th><th>Week</th><th>Clinics</th><th>Net paid</th><th>Status</th></tr></thead><tbody>${[['PB-0460','2–8 Nov','11','Rs 8.9 lakh','Paid'],['PB-0459','26 Oct–1 Nov','11','Rs 8.2 lakh','Paid'],['PB-0458','19–25 Oct','10','Rs 7.6 lakh','Paid (1 returned)']].map(b=>`<tr><td class="b">${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td><td class="b">${b[3]}</td><td><span class="chip lo">${b[4]}</span></td></tr>`).join('')}</tbody></table></section>`;

 <section class="card" style="overflow:hidden"><div class="between wrap" style="padding:14px 16px"><div><h3 class="sec">Batch PB-0461 · 9–15 Nov 2026</h3><div class="muted sm">Needs two approvals: Finance + Super admin</div></div>${done?'<span class="chip lo">Approved · sent to bank (IBFT)</span>':`<button class="btn pri" data-a="openModal" data-v="approvePay">${I('check',16)}Approve batch</button>`}</div>
 <div class="scroll"><table class="tbl"><thead><tr><th>Clinic</th><th>Bank account (IBAN)</th><th>Gross</th><th>Commission</th><th>Gateway</th><th>Net payout</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.n}</b></td><td class="sm" style="color:${r.bad?'#B42318':'inherit'}">${r.iban}</td><td>${rs(r.gross)}</td><td class="sm">− ${rs(r.fee)}</td><td class="sm">− ${rs(r.gw)}</td><td class="b">${rs(r.net)}</td><td>${r.bad?`<span class="chip hi">On hold</span> <button class="btn sm" data-a="toast" data-v="Asked ${esc(r.n)} to add their IBAN">Request IBAN</button>`:`<span class="chip ${done?'lo':'info'}">${done?'Sent':'Ready'}</span>`}</td></tr>`).join('')}</tbody></table></div></section>
 <div class="grid g4"><div class="card row" style="padding:16px"><span class="icob md">${I('clock')}</span><div><b>Finance approved</b><div class="muted sm">Usman (Finance) · today 10:42 AM</div></div></div><div class="card row" style="padding:16px"><span class="icob ${done?'lo':'neu'}">${I('shield')}</span><div><b>${done?'You approved':'Waiting for you'}</b><div class="muted sm">${done?'Just now':'Second approval required'}</div></div></div></div>`;
};

<script>
/* ================= SUPPORT ================= */
const PRI={High:'hi',Medium:'md',Low:'neu'};
V.support=()=>{const f=S.tkF;const list=S.tickets.filter(t=>f==='All'||t.status===f);const t=S.tickets.find(x=>x.id===S.tkSel)||list[0];if(t)S.tkSel=t.id;
 const cnt=s=>s==='All'?S.tickets.length:S.tickets.filter(x=>x.status===s).length;
 const sla=t=>t.sla==null?'':t.sla<0?`<span class="chip hi">${I('clock',12)}SLA breached ${-t.sla} min</span>`:`<span class="chip ${t.sla<30?'md':'neu'}">${I('clock',12)}${t.sla} min left</span>`;
 return `<div class="grid g4">${kpi('ticket','md',cnt('Open'),'Open tickets','1 past SLA','#B42318')}${kpi('clock','tl','14 min','Median first reply','Target: 30 min')}${kpi('star','lo','4.6 / 5','Satisfaction (30 d)','312 ratings')}${kpi('chat','info','61%','Answered by help articles','Before reaching a person')}</div>
 ${tabs('tkF',['Open','Pending','Resolved','All'].map(s=>[s,s+` <span class="chip neu" style="margin-left:4px">${cnt(s)}</span>`]),f)}
 <div class="row wrap" style="gap:20px;align-items:stretch"><section class="card" style="flex:1 1 320px;overflow:hidden;min-width:0">${list.map(x=>`<button data-a="tkSel" data-v="${x.id}" style="display:block;width:100%;padding:14px;border:0;border-bottom:1px solid #F2F4F7;background:${t&&t.id===x.id?'#E6F4F3':'#fff'};text-align:left"><div class="between"><span class="sm muted">${x.id} · ${x.ago}</span><span class="chip ${PRI[x.pri]}">${x.pri}</span></div><b style="display:block;margin:4px 0">${x.subj}</b><div class="between"><span class="muted sm">${x.from} · ${x.org}</span>${x.status==='Open'?sla(x):''}</div></button>`).join('')||'<div class="muted" style="padding:30px;text-align:center">No tickets.</div>'}</section>
 ${t?`<section class="card stack" style="flex:2 1 520px;padding:20px;gap:14px;min-width:0"><div class="between wrap"><div><div class="muted sm">${t.id} · ${t.cat}</div><b style="font-size:18px">${t.subj}</b><div class="muted sm">${t.from} · ${t.org}</div></div><div class="row wrap" style="gap:6px"><span class="chip ${PRI[t.pri]}">${t.pri}</span><span class="chip ${t.status==='Resolved'?'lo':t.status==='Pending'?'info':'md'}">${t.status}</span>${t.status==='Open'?sla(t):''}</div></div>
 <div class="row wrap" style="gap:12px;align-items:flex-end"><div><label class="lbl" for="tka">Assigned to</label>${sel('tka',['Unassigned','Mahnoor','Ali','Usman (Finance)','Engineering on-call'],t.asg,`data-a="tkAssign" data-v="${t.id}"`)}</div><div><label class="lbl" for="tkp">Priority</label>${sel('tkp',['High','Medium','Low'],t.pri,`data-a="tkPri" data-v="${t.id}"`)}</div>${t.cat==='Payments'?`<button class="btn" data-a="tkLookup" data-v="${t.id}">${I('search',15)}Look up JazzCash TID</button>`:''}${t.cat==='Sehat Card'?`<button class="btn" data-go="system">${I('server',15)}See Sehat Card API status</button>`:''}</div>
 ${t.found?`<div class="card" style="padding:12px;background:#ECFDF3;border-color:#ABEFC6"><b>JazzCash TID 1764790101 found</b><div class="sm">Rs 1,450 received 11:28 AM · webhook was delayed 6 min. <button class="lnk" data-a="tkReconcile" data-v="${t.id}">Mark invoice paid & notify clinic</button></div></div>`:''}
 <div class="stack" style="gap:10px;background:#F8FAFC;border-radius:12px;padding:14px;max-height:340px;overflow:auto">${t.msgs.map(m=>`<div style="align-self:${m[0]?'flex-end':'flex-start'};max-width:80%;background:${m[0]===2?'#FEF0C7':m[0]?'#0B7A75':'#fff'};color:${m[0]===1?'#fff':'inherit'};border:1px solid ${m[0]?'transparent':'#E3E8EF'};border-radius:14px;padding:10px 12px"><div class="sm" style="opacity:.8;margin-bottom:2px">${m[0]===2?'Internal note':m[0]?'CareConnect support':t.from} · ${m[2]}</div>${esc(m[1])}</div>`).join('')}</div>
 <div class="row wrap" style="gap:6px">${['Assalam-o-Alaikum, we’re looking into this now.','Please update the app from Play Store / App Store.','We’ve fixed this — please try again.'].map(r=>`<button class="pill" data-a="tkMacro" data-v="${esc(r)}">${esc(r.slice(0,34))}…</button>`).join('')}</div>
 <textarea id="tkd" class="inp" rows="3" placeholder="Write a reply…" data-i="tkDraft" data-norender="1">${esc(S.tkDraft)}</textarea>
 <div class="row wrap"><button class="btn pri" data-a="tkReply" data-v="${t.id}">${I('send',16)}Send reply</button><button class="btn" data-a="tkNote" data-v="${t.id}">Add internal note</button>${t.status!=='Resolved'?`<button class="btn" data-a="tkResolve" data-v="${t.id}" style="margin-left:auto">${I('check',16)}Resolve</button>`:`<button class="btn" data-a="tkReopen" data-v="${t.id}" style="margin-left:auto">Reopen</button>`}</div></section>`:''}</div>`;
};
const tk=id=>S.tickets.find(x=>x.id===id);
A.tkF=v=>{S.tkF=v;S.tkSel=null;render()};A.tkSel=v=>{S.tkSel=v;S.tkDraft='';render()};
A.tkAssign=(v,el)=>{tk(v).asg=el.value;render();toast('Assigned to '+el.value)};
A.tkPri=(v,el)=>{tk(v).pri=el.value;render()};
A.tkLookup=v=>{tk(v).found=1;render()};
A.tkReconcile=v=>{const t=tk(v);t.found=0;t.msgs.push([1,'Payment found and invoice marked paid. Sorry for the delay — the JazzCash confirmation reached us 6 minutes late.','now']);t.status='Resolved';audit('Mahnoor (Support)','Reconciled payment','JazzCash TID 1764790101');render();toast('Invoice marked paid · clinic notified')};
A.tkMacro=v=>{S.tkDraft=v;render()};
A.tkReply=v=>{const t=tk(v),txt=(S.tkDraft||'').trim();if(!txt){toast('Write a reply first');return}t.msgs.push([1,txt,'now']);if(t.status==='Open')t.status='Pending';t.sla=null;S.tkDraft='';render();toast('Reply sent by app + WhatsApp')};
A.tkNote=v=>{const t=tk(v),txt=(S.tkDraft||'').trim();if(!txt){toast('Write the note first');return}t.msgs.push([2,txt,'now']);S.tkDraft='';render();toast('Internal note added (not visible to customer)')};
A.tkResolve=v=>{const t=tk(v);t.status='Resolved';t.sla=null;render();toast(v+' resolved · satisfaction survey sent')};
A.tkReopen=v=>{tk(v).status='Open';tk(v).sla=60;render()};

V.analytics=()=>{const fun=[['App downloads',412000],['Registered',314200],['Booked an appointment',168900],['Completed a visit',151300],['Booked again within 90 days',88100]];
 const coh=[['Jun',100,62,51,46,42,40],['Jul',100,64,53,47,44,null],['Aug',100,66,55,49,null,null],['Sep',100,69,57,null,null,null],['Oct',100,71,null,null,null,null],['Nov',100,null,null,null,null,null]];
 const hc=v=>v==null?'#fff':`rgba(11,122,117,${(v/100*.9+.08).toFixed(2)})`;
 const spec=[['General Physician',31],['Paediatrics',17],['Gynaecology',14],['Dermatology',10],['Cardiology',8],['Psychiatry (video)',7],['Dental',6],['Other',7]];
 return `<div class="row wrap">${pills('anP',['Last 7 days','Last 30 days','Last 90 days','This year'],S.an.period)}<button class="btn" style="margin-left:auto" data-a="toast" data-v="Report exported to Excel">${I('download',16)}Export</button></div>
 <div class="grid g4">${kpi('users','info','2.1 lakh','Monthly active patients','67% use Urdu interface')}${kpi('video','tl','38%','Visits by video','Up from 29% in June','#067647')}${kpi('clock','md','11 min','Average wait at clinic','Down 4 min since go-live','#067647')}${kpi('alert','hi','7.2%','No-show rate','Reminders cut this from 15%','#067647')}</div>
 <div class="grid g2"><section class="card stack" style="padding:20px;gap:10px"><h3 class="sec">Patient funnel</h3>${fun.map((f,i)=>`<div><div class="between sm"><span>${f[0]}</span><span><b>${f[1].toLocaleString()}</b> ${i?`<span class="muted">· ${Math.round(f[1]/fun[i-1][1]*100)}% of previous</span>`:''}</span></div><div class="bar" style="height:22px;margin-top:4px;border-radius:6px"><div style="width:${Math.round(f[1]/fun[0][1]*100)}%;border-radius:6px"></div></div></div>`).join('')}<p class="muted sm">Biggest drop: registered → first booking. Most say they "were just checking" — try a free first video consult campaign.</p></section>
 <section class="card stack" style="padding:20px;gap:10px"><h3 class="sec">Patients still booking, by month joined</h3><div class="scroll"><table class="heat" style="border-collapse:separate;width:100%"><thead><tr><th class="sm muted" style="text-align:left">Joined</th>${['M0','M1','M2','M3','M4','M5'].map(m=>`<th class="sm muted">${m}</th>`).join('')}</tr></thead><tbody>${coh.map(r=>`<tr><td class="sm b" style="text-align:left">${r[0]}</td>${r.slice(1).map(v=>`<td style="background:${hc(v)};color:${v>55?'#fff':'#0F1B2D'}">${v==null?'':v+'%'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted sm">Newer groups are staying longer — the family accounts feature launched in August.</p></section></div>
 <div class="grid g3"><section class="card stack" style="padding:20px;gap:10px"><h3 class="sec">Visits by specialty</h3>${spec.map(s=>`<div class="between sm"><span>${s[0]}</span><span class="row" style="gap:8px;flex:0 0 55%"><span class="bar" style="flex:1"><span style="display:block;height:100%;width:${s[1]/31*100}%;background:#3E3CB0;border-radius:999px"></span></span><b style="width:32px;text-align:right">${s[1]}%</b></span></div>`).join('')}</section>
 <section class="card stack" style="padding:20px;gap:10px"><h3 class="sec">How patients pay</h3>${[['JazzCash',34,'#D92D20'],['Cash at clinic',27,'#5B6B7F'],['Easypaisa',18,'#12B76A'],['Debit / credit card',11,'#3E3CB0'],['Sehat Card',7,'#0B7A75'],['Private insurance',3,'#F79009']].map(p=>`<div class="between sm"><span class="row" style="gap:8px"><span class="dot" style="background:${p[2]}"></span>${p[0]}</span><b>${p[1]}%</b></div>`).join('')}</section>
 <section class="card stack" style="padding:20px;gap:10px"><h3 class="sec">Feature use (active clinics)</h3>${[['Appointments & queue',98],['Patient records',94],['Prescriptions via app',81],['Video consults',62],['Campaigns',37],['AI notes',29],['Care plans',24]].map(p=>`<div><div class="between sm"><span>${p[0]}</span><b>${p[1]}%</b></div><div class="bar" style="margin-top:4px"><div style="width:${p[1]}%"></div></div></div>`).join('')}</section></div>`;
};

V.compliance=()=>{const c=S.comp;const head=tabs('compTab',[['requests','Patient data requests',c.reqs.filter(r=>r.status==='Pending').length||''],['access','Support access approvals',c.access.filter(r=>r.status==='Pending').length||''],['audit','Admin audit log'],['policy','Policies']],c.tab);
 if(c.tab==='requests')return head+`<section class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>Request</th><th>Type</th><th>From</th><th>Received</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>${c.reqs.map(r=>`<tr><td class="b sm">${r.id}</td><td>${r.type}</td><td>${r.who}</td><td class="sm">${r.when}</td><td class="sm">${r.due}</td><td><span class="chip ${r.status==='Pending'?'md':'lo'}">${r.status}</span></td><td style="white-space:nowrap">${r.status==='Pending'?(r.type.startsWith('Delete')?`<button class="btn sm dan" data-a="reqDel" data-v="${r.id}">Review deletion</button>`:`<button class="btn sm pri" data-a="reqDone" data-v="${r.id}">Prepare export</button>`):''}</td></tr>`).join('')}</tbody></table></section><p class="muted sm">Deleting an account removes the patient's app profile. Clinical records the clinics must keep by law stay with the clinic and are marked "patient left CareConnect".</p>`;
 if(c.tab==='access')return head+`<p class="muted">Support staff can only open a clinic's account after a second person approves. Access ends automatically.</p><section class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>Who</th><th>Clinic</th><th>Reason</th><th>For</th><th>Status</th><th></th></tr></thead><tbody>${c.access.map(r=>`<tr><td><b>${r.who}</b><div class="muted sm">${r.id}</div></td><td>${r.org}</td><td class="sm">${r.why}</td><td>${r.dur}</td><td><span class="chip ${r.status==='Pending'?'md':r.status==='Approved'?'lo':r.status==='Denied'?'hi':'neu'}">${r.status}</span></td><td style="white-space:nowrap">${r.status==='Pending'?(r.who.startsWith('You')?'<span class="muted sm">Needs another approver</span>':`<button class="btn sm pri" data-a="accOk" data-v="${r.id}">Approve</button> <button class="btn sm" data-a="accNo" data-v="${r.id}">Deny</button>`):r.status==='Approved'?`<button class="btn sm" data-a="accEnd" data-v="${r.id}">End now</button>`:''}</td></tr>`).join('')}</tbody></table></section>`;
 if(c.tab==='audit')return head+`<section class="card" style="overflow:hidden"><div class="between" style="padding:14px 16px"><span class="muted sm">${AUDIT.length} entries · cannot be edited or deleted</span><button class="btn sm" data-a="toast" data-v="Audit log exported">${I('download',14)}Export</button></div><table class="tbl"><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody>${AUDIT.map(a=>`<tr><td class="sm" style="white-space:nowrap">${a[0]}</td><td>${a[1]}</td><td><span class="chip neu">${a[2]}</span></td><td class="sm">${esc(a[3])}</td></tr>`).join('')}</tbody></table></section>`;
 return head+`<div class="grid g2">${[['Data storage','Patient data is stored in Pakistan region data centres. Backups encrypted, kept 35 days.'],['Admin roles','Super admin, Finance, Support, Compliance, Read-only. Two-person approval for payouts and support access.'],['Sign-in security','All admins use 2-step verification. Sessions end after 30 minutes idle.'],['Clinic agreements','Every clinic accepts the data processing terms at sign-up; renewal yearly.']].map(p=>`<div class="card" style="padding:18px"><b>${p[0]}</b><p class="muted sm" style="margin-top:6px">${p[1]}</p></div>`).join('')}</div><p class="muted sm">Placeholder text — confirm requirements with your legal advisor (e.g. Pakistan's Prevention of Electronic Crimes Act and any personal data protection law in force).</p>`;
};
A.compTab=v=>{S.comp.tab=v;render()};

A.reqDel=v=>{S.delR=v;S.modal='delReq';renderOv()};

V.system=()=>{const f=S.sys.flags;return `<div class="grid g4">${kpi('server','lo','99.98%','Uptime (30 days)','Target 99.9%','#067647')}${kpi('alert','md','1','Degraded service','Sehat Card eligibility','#B54708')}${kpi('phone','info','2.0.4','Latest app version','Android & iOS')}${kpi('users','tl','8,412','Users online now','Peak today 11:05 AM')}</div>
 <section class="card" style="overflow:hidden"><div class="between" style="padding:14px 16px"><h3 class="sec">Services</h3><button class="btn sm" data-a="toast" data-v="Status page updated for clinics">${I('mega',14)}Post status update</button></div><table class="tbl"><tbody>${SERVICES.map(s=>`<tr><td><span class="row" style="gap:10px"><span class="status-dot" style="background:${s[2]==='Operational'?'#12B76A':'#F79009'}"></span><b>${s[0]}</b></span></td><td class="sm muted">${s[1]}</td><td class="sm">${s[3]}</td><td><span class="chip ${s[2]==='Operational'?'lo':'md'}">${s[2]}</span></td></tr>`).join('')}</tbody></table></section>
 <section class="card" style="overflow:hidden"><div style="padding:14px 16px"><h3 class="sec">Feature flags</h3><div class="muted sm">Turn features on or off and roll out to a share of clinics. Changes are logged.</div></div><table class="tbl"><tbody>${FLAGS.map(x=>{const [on,pct]=f[x[0]];return `<tr><td><b>${x[1]}</b><div class="muted sm">${x[2]}</div></td><td style="width:260px">${on?`<div class="row" style="gap:8px"><input type="range" min="0" max="100" step="5" value="${pct}" aria-label="Rollout for ${x[1]}" data-a="flagPct" data-v="${x[0]}" style="flex:1;accent-color:#0B7A75"><b class="sm" style="width:40px">${pct}%</b></div>`:'<span class="muted sm">Off for everyone</span>'}</td><td style="width:80px"><label class="row" style="gap:6px;cursor:pointer"><input type="checkbox" class="chk" ${on?'checked':''} data-a="flagT" data-v="${x[0]}" aria-label="Toggle ${x[1]}">${on?'On':'Off'}</label></td></tr>`}).join('')}</tbody></table></section>
 <section class="card stack" style="padding:20px;gap:12px"><h3 class="sec">App versions</h3><div class="row wrap" style="gap:16px;align-items:flex-end"><div><label class="lbl" for="mina">Minimum Android version</label>${sel('mina',['1.9.0','2.0.0','2.0.3','2.0.4'],S.sys.minAndroid,'data-i="sys.minAndroid"')}</div><div><label class="lbl" for="mini">Minimum iOS version</label>${sel('mini',['1.9.0','2.0.0','2.0.3','2.0.4'],S.sys.minIos,'data-i="sys.minIos"')}</div><button class="btn pri" data-a="forceUpd">Save & ask older apps to update</button></div><div class="muted sm">${S.sys.minAndroid==='2.0.4'?'About 18% of Android users are on older versions and will see "Please update" on next open.':'Users below the minimum see "Please update" on next open.'}</div></section>`};
A.flagT=v=>{const f=S.sys.flags[v];f[0]=f[0]?0:1;if(f[0]&&!f[1])f[1]=10;audit('You (Super admin)','Changed flag',FLAGS.find(x=>x[0]===v)[1]+(f[0]?' → on '+f[1]+'%':' → off'));render();toast(f[0]?'Turned on for '+f[1]+'% of clinics':'Turned off')};
A.flagPct=(v,el)=>{S.sys.flags[v][1]=+el.value;audit('You (Super admin)','Changed flag',FLAGS.find(x=>x[0]===v)[1]+' rollout → '+el.value+'%');render()};
A.forceUpd=()=>{audit('You (Super admin)','Set minimum app version','Android '+S.sys.minAndroid+' · iOS '+S.sys.minIos);toast('Minimum versions saved')};

/* ================= ANNOUNCEMENT ================= */
M.announce=()=>mhead('Send announcement','Shown in the app and sent through the channels you pick')+`<label class="lbl" for="aa" style="margin-top:14px">Audience</label>${sel('aa',['All clinics','Clinics on Pro & Enterprise','Clinics in Peshawar','All doctors','All patients'],S.ann.aud,'data-i="ann.aud"')}<label class="lbl" for="at" style="margin-top:12px">Message</label><textarea id="at" class="inp" rows="4">Sehat Card eligibility checks are slow this morning because of a State Life system issue. Please note card numbers and we will check them automatically once the service is back.</textarea><div class="row" style="gap:14px;margin-top:12px">${['App','SMS','Email'].map(c=>`<label class="row" style="gap:6px"><input type="checkbox" class="chk" data-t="ann.ch.${c}" ${S.ann.ch[c]?'checked':''}>${c}</label>`).join('')}</div><div class="muted sm" style="margin-top:8px">${S.ann.aud.includes('patients')?'≈ 3.1 lakh people':S.ann.aud==='All doctors'?'1,904 doctors':S.ann.aud.includes('Peshawar')?'21 clinics':S.ann.aud.includes('Pro')?'96 clinics':'296 clinics'}${S.ann.ch.SMS?' · SMS cost ≈ Rs '+(S.ann.aud.includes('patients')?'1,24,000':'1,200'):''}</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn pri" data-a="sendAnn">${I('send',16)}Send</button></div>`;
A.sendAnn=()=>{audit('You (Super admin)','Sent announcement',S.ann.aud);S.modal=null;render();toast('Announcement sent to '+S.ann.aud.toLowerCase())};

/* ================= EVENTS ================= */
function setPath(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(!a)return;if(a.tagName==='SELECT'||(a.tagName==='INPUT'&&a.type!=='checkbox'))return;
 if((a.dataset.a==='closeModal'||a.dataset.a==='closeDrawer')&&(a.classList.contains('bg')||a.classList.contains('drawer-bg'))&&e.target.closest('[data-stop]'))return;
 if(a.tagName==='INPUT')e.preventDefault();
 const f=A[a.dataset.a];if(f)f(a.dataset.v,a);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.t){setPath(el.dataset.t,el.checked?1:0);S.modal?renderOv():render();return}
 if((el.tagName==='SELECT'||el.type==='range')&&el.dataset.a&&A[el.dataset.a]){A[el.dataset.a](el.dataset.v,el);return}
 if(el.tagName==='SELECT'&&el.dataset.i){setPath(el.dataset.i,el.value);S.modal?renderOv():render()}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.i||el.tagName==='SELECT')return;setPath(el.dataset.i,el.value);if(el.dataset.norender)return;const id=el.id,pos=el.selectionStart;if(S.modal)renderOv();else render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.drawer)){if(S.modal)S.modal=null;else S.drawer=null;render()}});
let dragId=null;
document.addEventListener('dragstart',e=>{const d=e.target.closest&&e.target.closest('[data-drag]');if(d){dragId=d.dataset.drag;try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!dragId)return;e.preventDefault();const o=S.onb.find(x=>x.id===dragId);const from=STAGES.indexOf(o.stage),to=STAGES.indexOf(z.dataset.drop);dragId=null;if(to===from)return;
 if(Math.abs(to-from)>1){toast('Move one stage at a time');return}A.onbMove(o.id+':'+(to-from))});
render();
</script>
