<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareConnect · Patient app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0B7A75;--teal-d:#075E5A;--teal-50:#E6F4F3;--teal-l:#7FE3DA;--navy:#0E2233;--ink:#0F1B2D;--muted:#5B6B7F;--line:#E3E8EF;--bg:#F3F6F9;--red:#B42318;--red-50:#FEE4E2;--amb:#93370D;--amb-50:#FEF0C7;--grn:#067647;--grn-50:#DCFAE6;--blu:#075985;--blu-50:#E0F2FE;--pu:#3E3CB0;--pu-50:#EEF0FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#E9EFF4;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',Inter,sans-serif;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2}
/* layout */
.stage{min-height:100vh;display:flex;gap:40px;align-items:flex-start;justify-content:center;padding:32px 24px}
.side{width:300px;flex:none;display:flex;flex-direction:column;gap:16px;position:sticky;top:32px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:'Plus Jakarta Sans';font-size:20px;font-weight:800}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--line);background:#F8FAFC;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;color:#344054}
.jump button:hover,.jump button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.phone{width:390px;height:844px;flex:none;background:#fff;border-radius:48px;border:12px solid #0F1B2D;box-shadow:0 30px 70px rgba(15,27,45,.28);position:relative;overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
@media (max-width:820px){.stage{padding:0;gap:0}.side{display:none}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}}
/* components */
.pad{padding:0 20px}
.top{display:flex;align-items:center;gap:10px;padding:18px 20px 10px;position:sticky;top:0;background:#fff;z-index:5}
.top h2{font-size:18px;flex:1}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.ib:hover{background:var(--bg)}
.ib.soft{background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid #D0D8E2;background:#fff;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.hi{background:var(--red-50);color:var(--red)}.md{background:var(--amb-50);color:var(--amb)}.lo{background:var(--grn-50);color:var(--grn)}.info{background:var(--blu-50);color:var(--blu)}.neu{background:#EEF2F6;color:#364152}.tl{background:var(--teal-50);color:#0B5F5B}.pu{background:var(--pu-50);color:var(--pu)}
.pill{border:1px solid #D0D8E2;background:#fff;border-radius:999px;padding:0 14px;min-height:38px;font-weight:600;font-size:13px;color:#344054;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}.sm{font-size:12px}.b{font-weight:600}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
.ico{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sec{font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans'}
.inp{width:100%;height:50px;border:1px solid #D0D8E2;border-radius:14px;padding:0 14px;background:#fff;font-size:15px}
textarea.inp{height:auto;padding:12px 14px;resize:none}
.inp:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.lbl{display:block;font-size:13px;font-weight:600;color:#475467;margin-bottom:6px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;min-height:40px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.list>*{border-bottom:1px solid #F2F4F7}
.list>*:last-child{border-bottom:0}
.item{display:flex;gap:12px;align-items:center;padding:14px 0;width:100%;border:0;background:none;text-align:left}
.stack{display:flex;flex-direction:column}
.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.bar{height:8px;border-radius:999px;background:#EEF2F6;overflow:hidden}.bar>div{height:100%;background:var(--teal);border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.tog{position:relative;width:46px;height:28px;flex:none}
.tog input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.tog span{position:absolute;inset:0;background:#D0D8E2;border-radius:999px;transition:.2s}
.tog span:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog input:checked+span{background:var(--teal)}
.tog input:checked+span:after{transform:translateX(18px)}
.tog input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
/* nav */
.nav{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 6px 14px;flex:none}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:#7A8A9C;min-height:52px;padding-top:4px;position:relative}
.nav button.on{color:var(--teal)}
.nav .badge{position:absolute;top:2px;left:55%;background:#D92D20;color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
/* overlays */
.sheet-bg{position:absolute;inset:0;background:rgba(15,27,45,.45);z-index:30;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:88%;overflow:auto}
.grab{width:40px;height:5px;border-radius:9px;background:#D0D8E2;margin:0 auto 14px}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;z-index:40;display:flex;gap:10px;align-items:center;font-weight:500;animation:up .25s ease}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.slide{position:relative;height:60px;border-radius:30px;background:#3E3CB0;overflow:hidden}
.slide input{-webkit-appearance:none;appearance:none;width:100%;height:100%;background:transparent;margin:0;position:relative;z-index:2;cursor:grab}
.slide input::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.slide input::-moz-range-thumb{width:52px;height:52px;border-radius:50%;background:#fff;border:0}
.slide .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;pointer-events:none;padding-left:40px}
.otp{display:flex;gap:10px;justify-content:center}
.otp input{width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;border:1px solid #D0D8E2;border-radius:14px}
.otp input:focus{outline:2px solid var(--teal)}
.hero{background:linear-gradient(160deg,#E6F4F3 0%,#fff 70%)}
.cal-d{width:56px;height:68px;border-radius:16px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:12px;color:var(--muted)}
.cal-d b{font-size:18px;color:var(--ink)}
.cal-d.on{background:var(--teal);border-color:var(--teal);color:#E6F4F3}.cal-d.on b{color:#fff}
.cal-d:disabled{opacity:.4}
.slot{border:1px solid #D0D8E2;background:#fff;border-radius:12px;min-height:42px;font-weight:600;font-size:13px}
.slot.on{background:var(--teal);border-color:var(--teal);color:#fff}
.slot:disabled{background:#F2F4F7;color:#98A2B3;text-decoration:line-through;border-color:#F2F4F7}
.map{height:250px;border-radius:18px;position:relative;overflow:hidden;background:#E8EFE9}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0}
.pin span{display:block;background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
.pin.on span{background:var(--ink)}
.video{background:#0B1622;color:#fff;min-height:100%;display:flex;flex-direction:column}
.cbtn{width:56px;height:56px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:#36506A}
.bubble{max-width:82%;padding:10px 14px;border-radius:18px}
.focus-ring:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.skip{position:absolute;left:-999px}
</style>

<style id="cc-gradient">
body{background:radial-gradient(900px 600px at 85% -10%,rgba(11,122,117,.28),transparent 60%),radial-gradient(800px 600px at 0% 110%,rgba(62,60,176,.18),transparent 60%),linear-gradient(160deg,#DFF1EF 0%,#EEF3F7 50%,#E6E9FA 100%);background-attachment:fixed}
.phone{background:linear-gradient(180deg,#E3F3F1 0%,#F4F8FB 34%,#F7F7FD 100%)}
.top{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
</style>
</head>

<div class="stage">
  <aside class="side" aria-label="Prototype controls">
    <div class="brand"><svg width="38" height="38" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#0B7A75"/><path d="M17 25.5s-8-4.6-8-10.2A4.3 4.3 0 0 1 17 13a4.3 4.3 0 0 1 8 2.3c0 5.6-8 10.2-8 10.2z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M10.5 17h3.5l1.5-2.5 2.2 5 1.5-2.5h4.3" fill="none" stroke="#7FE3DA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>CareConnect</b><div class="muted sm">Patient app · interactive prototype</div></div></div>
    <div class="panel"><h4>Jump to screen</h4><div class="jump" id="jump"></div></div>
    <div class="panel"><h4>Demo controls</h4>
      <div class="between" style="margin-bottom:10px"><span class="b">App language</span><div class="tabs" style="width:150px" id="langT"></div></div>
      <button class="btn sm block" id="resetBtn">Restart from login</button>
      <p class="muted sm" style="margin-top:10px">Everything is clickable. Data is sample data and resets on reload.</p>
    </div>
  </aside>
  <div class="phone" id="phone" role="application" aria-label="CareConnect patient app">
    <div class="scr" id="scr"></div>
    <div id="navWrap"></div>
    <div id="overlay"></div>
  </div>
</div>

 const pct=S.qStep*33;
 const head=(t,s)=>`<div style="background:linear-gradient(120deg,#E6F4F3,#fff);padding:18px 20px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)"><div style="flex:1"><h3 class="sec">${t}</h3><p class="muted sm">${s}</p></div><div style="width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--teal) 0 ${pct}%,#D0D8E2 ${pct}% 100%);display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">${Math.min(S.qStep,3)} of 3</div></div></div>`;
 const yn=(k,label)=>`<div><div class="b" style="margin-bottom:8px">${label} <span style="color:var(--red)">*</span></div><div class="row" style="gap:8px">${['Yes','No'].map(o=>`<button class="pill ${S.qAns[k]===o?'on':''}" style="min-width:72px;justify-content:center" data-act="qAns" data-k="${k}" data-v="${o}">${o}</button>`).join('')}</div></div>`;
 let body='';
 if(S.qStep===1) body=head('Reason for visit','Helps your doctor prepare')+`<div class="pad stack g20" style="padding-top:18px">
  <div><label class="lbl" for="sq">What symptoms are you having? <span style="color:var(--red)">*</span></label><div style="position:relative"><span style="position:absolute;left:14px;top:14px;color:var(--muted)">${I('search',20)}</span><input id="sq" class="inp" style="padding-left:44px" placeholder="Search symptoms" value="${esc(S.symQ)}" data-in="symQ"></div>

  ${yn('seen','Have you seen this doctor before?')}${yn('concern','Anything specific you want to discuss?')}
  ${S.syms.some(x=>['Bleeding','Reduced baby movements','Severe abdominal pain','Blurred vision'].includes(x))?`<div class="card" style="padding:12px;background:#FEF3F2;border-color:#FECDCA;display:flex;gap:10px"><span style="color:var(--red)">${I('alert',20)}</span><div class="sm"><b>This could need urgent care.</b> Don't wait for the appointment — call your doctor or go to the nearest emergency.</div></div>`:''}
 </div>`;
 if(S.qStep===2) body=head('Medical history','Shared only with your doctor')+`<div class="pad stack g20" style="padding-top:18px">
  ${yn('chronic','Any long-term condition? (diabetes, BP, asthma)')}
  <div><label class="lbl" for="qm">Medicines you take now</label><textarea id="qm" class="inp" rows="3" placeholder="Type here">Folic acid 5 mg, Ferrous sulfate 200 mg</textarea></div>
  <div><label class="lbl" for="qa">Allergies to medicines or food</label><textarea id="qa" class="inp" rows="3" placeholder="Type here"></textarea></div>

 if(S.qStep===3) body=`<div style="background:linear-gradient(180deg,#E6F4F3,#fff);padding:40px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px"><span class="ico" style="width:72px;height:72px;border-radius:50%;background:#12B76A;color:#fff">${I('check',38,'#fff',2.6)}</span><h2>Successfully submitted</h2><p class="muted">Your doctor will see this before the visit. A copy was sent to your email.</p><button class="btn sm" data-act="toast" data-v="Showing your answers">View response</button></div>
  <div class="pad"><div class="card" style="padding:16px"><h3 class="sec" style="margin-bottom:8px">Before your visit</h3>${['Arrive 10 minutes early at the clinic reception','Bring your CNIC and Sehat Card','Bring your previous reports and pregnancy file'].map(x=>`<div class="row" style="padding:8px 0;align-items:flex-start"><span style="color:#12B76A">${I('check',20,'currentColor',2.4)}</span><span>${x}</span></div>`).join('')}</div></div>`;

document.addEventListener('click',e=>{
 const j=e.target.closest('[data-jump]');
 if(j){const s=j.dataset.jump;S.stack=s==='login'||s==='home'?[]:['home'];S.screen=s;S.sheet=null;if(s==='call')startCall();else stopCall();render();return}
 const t=e.target.closest('[data-tab]');if(t){tab(t.dataset.tab);return}
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-act]');
 if(a){
  if(a.dataset.act==='closeSheet'&&e.target.closest('[data-stop]'))return;
  const f=A[a.dataset.act];if(f){e.preventDefault();f(a.dataset.v,a)}
 }
});
document.getElementById('resetBtn').addEventListener('click',()=>{S.stack=[];S.screen='login';S.sheet=null;stopCall();render()});

  const k=el.dataset.in;
  if(k==='painVal'){S.pain[S.painEx]=+el.value;render(true);return}
